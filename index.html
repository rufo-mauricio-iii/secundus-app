<script>
"use strict";
/* ======================= rails: the one door to the repo ======================= */
const API = "https://api.github.com";
const store = {
  get pat()  { return localStorage.getItem("secundus.pat") || ""; },
  set pat(v) { localStorage.setItem("secundus.pat", v); },
  get repo() { return localStorage.getItem("secundus.repo") || ""; },
  set repo(v){ localStorage.setItem("secundus.repo", v); },
};

async function gh(path, opts = {}) {
  const url = path ? `${API}/repos/${store.repo}/${path}` : `${API}/repos/${store.repo}`;
  const res = await fetch(url, {
    ...opts,
    headers: {
      "Authorization": `Bearer ${store.pat}`,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      ...(opts.headers || {}),
    },
  });
  return res;
}
function b64decode(b64) {
  return new TextDecoder().decode(Uint8Array.from(atob(String(b64).replaceAll("\n", "")), c => c.charCodeAt(0)));
}
function b64encode(text) {
  const bytes = new TextEncoder().encode(text);
  let bin = ""; for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}
/* read one file -> { data (parsed json or raw), sha } ; null if 404 */
async function readFile(path) {
  const res = await gh(`contents/${path}?t=${Date.now()}`);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`GitHub ${res.status} reading ${path}`);
  const body = await res.json();
  const raw = b64decode(body.content);
  let data; try { data = JSON.parse(raw); } catch { data = raw; }
  shaMap.set(path, body.sha);   // priming the sha here is what lets writes skip a read
  return { data, sha: body.sha, raw };
}
/* list a directory -> [{name, path, sha}] ; [] if 404 */
async function listDir(path) {
  const res = await gh(`contents/${path}?t=${Date.now()}`);
  if (res.status === 404) return [];
  if (!res.ok) throw new Error(`GitHub ${res.status} listing ${path}`);
  return (await res.json()).map(f => ({ name: f.name, path: f.path, sha: f.sha }));
}
/* write a file (create or update). shaMap caches shas so repeat writes skip a read. */
const shaMap = new Map();
async function writeRaw(path, text, message) {
  for (let attempt = 1; attempt <= 3; attempt++) {
    const body = { message, content: b64encode(text) };
    if (shaMap.has(path)) body.sha = shaMap.get(path);
    const res = await gh(`contents/${path}`, { method: "PUT", body: JSON.stringify(body) });
    if (res.ok) {
      const j = await res.json();
      shaMap.set(path, j.content.sha);
      return true;
    }
    if (res.status === 409 || res.status === 422) {   // raced or stale/missing sha — refresh and retry
      const cur = await readFile(path);
      if (cur) shaMap.set(path, cur.sha); else shaMap.delete(path);
      await new Promise(r => setTimeout(r, 350 * attempt));
      continue;
    }
    throw new Error(`GitHub ${res.status} writing ${path}`);
  }
  throw new Error(`write conflict persisted on ${path}`);
}
async function deleteFile(path, message) {
  if (!shaMap.has(path)) {
    const cur = await readFile(path);
    if (!cur) return true;
    shaMap.set(path, cur.sha);
  }
  const res = await gh(`contents/${path}`, {
    method: "DELETE",
    body: JSON.stringify({ message, sha: shaMap.get(path) }),
  });
  if (res.ok || res.status === 404) { shaMap.delete(path); return true; }
  throw new Error(`GitHub ${res.status} deleting ${path}`);
}
/* read-modify-write with conflict retry for shared JSON docs (sessions etc.) */
async function saveJSON(path, mutate, message) {
  for (let attempt = 1; attempt <= 3; attempt++) {
    const cur = await readFile(path);
    const data = cur ? cur.data : {};
    if (cur) shaMap.set(path, cur.sha);
    const next = mutate(structuredClone(data));
    try {
      await writeRaw(path, JSON.stringify(next, null, 2) + "\n", message);
      return next;
    } catch (e) {
      if (attempt === 3) throw e;
      await new Promise(r => setTimeout(r, 350 * attempt));
    }
  }
}
/* private-repo image -> blob URL (cached) */
const imgCache = new Map();
async function imageURL(path) {
  if (imgCache.has(path)) return imgCache.get(path);
  const res = await gh(`contents/${path}`, { headers: { "Accept": "application/vnd.github.raw+json" } });
  if (!res.ok) throw new Error(`img ${res.status}`);
  const url = URL.createObjectURL(await res.blob());
  imgCache.set(path, url);
  return url;
}

/* ---- Obsidian DOM shim -------------------------------------------------
   The vault widgets are written against Obsidian's createDiv/createEl/empty/
   setText helpers. Implementing them here lets the ports stay near-verbatim
   against Workout.md / Food.md, so upstream changes remain easy to re-apply. */
(() => {
  const P = Element.prototype;
  function build(tag, o) {
    const n = document.createElement(tag);
    if (o) {
      if (o.cls) n.className = o.cls;
      if (o.text != null) n.textContent = o.text;
      if (o.attr) for (const k in o.attr) n.setAttribute(k, o.attr[k]);
      if (o.href) n.href = o.href;
      if (o.type) n.type = o.type;
      if (o.value != null) n.value = o.value;
    }
    return n;
  }
  P.createEl  = function (tag, o) { const n = build(tag, o); this.appendChild(n); return n; };
  P.createDiv = function (o) { return this.createEl("div", o); };
  P.createSpan= function (o) { return this.createEl("span", o); };
  P.empty     = function () { while (this.firstChild) this.removeChild(this.firstChild); };
  P.setText   = function (t) { this.textContent = t; };
  P.addClass  = function (...c) { this.classList.add(...c.filter(Boolean)); };
  P.removeClass = function (...c) { this.classList.remove(...c.filter(Boolean)); };
  P.hasClass  = function (c) { return this.classList.contains(c); };
  P.toggleClass = function (c, on) { this.classList.toggle(c, on); };
  window.createDiv = (o) => build("div", o);   // Obsidian's detached global
  window.createEl  = (tag, o) => build(tag, o);
})();

/* ============================== app shell ============================== */
/* Spaces exposed in this build — others stay dark until their milestone ships. */
const SPACES = ["workout", "food"];
const $ = id => document.getElementById(id);
function el(parent, tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  parent.appendChild(n);
  return n;
}
function toast(msg, ms = 2500) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", ms);
}
function show(space) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  $(`view-${space}`).classList.add("active");
  document.querySelectorAll("nav.app button").forEach(b =>
    b.classList.toggle("active", b.dataset.space === space));
  localStorage.setItem("secundus.space", space);
  if (space === "workout") Workout.mount();
  if (space === "food") Food.mount();
}
function boot() {
  const nav = $("nav");
  nav.innerHTML = SPACES.map(s => `<button data-space="${s}">${s}</button>`).join("");
  nav.onclick = e => e.target.dataset.space && show(e.target.dataset.space);
  nav.hidden = SPACES.length < 2;   // one space = no tab bar to explain
  verifyConnection().then(ok => {
    if (!ok) return;
    const saved = localStorage.getItem("secundus.space");
    show(SPACES.includes(saved) ? saved : SPACES[0]);
  });
}
async function verifyConnection() {
  const dot = $("sync-dot"), label = $("sync-label");
  try {
    const res = await gh("");
    if (!res.ok) throw new Error(res.status);
    dot.className = "ok"; label.textContent = store.repo.split("/")[1];
    return true;
  } catch {
    dot.className = "err"; label.textContent = "connection failed";
    toast("Repo connection failed — check token", 4000);
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    $("gate").classList.add("active");
    return false;
  }
}
$("connect").onclick = () => {
  const pat = $("pat").value.trim();
  if (!pat) { toast("Paste a token first"); return; }
  store.pat = pat; store.repo = $("repo-select").value;
  boot();
};
if (store.pat && store.repo) boot();
/* PWA install support — passthrough worker, no caching (updates stay instant) */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

/* ====================================================================
   WORKOUT — faithful port of orgs/health/Workout.md (Renovatio skin).
   Same files, same entry schema; the PC widget and /workout-review
   read what this writes. Append-only log: one JSON per movement/day.
   ==================================================================== */
const Workout = (() => {
  const WEEK_PATH     = "orgs/health/data/workout/workout-week.json";
  const LOG_DIR       = "orgs/health/data/workout/workout-log";
  const LOG_PATH      = "orgs/health/data/workout/workout-log.json";
  const SESSIONS_PATH = "orgs/health/data/workout/workout-sessions.json";

  let mounted = false, week = null, log = [], sessions = {};
  let root, host, tabEls = [], gearEls = {}, lightbox = null;

  /* ---- helpers straight from the widget ---- */
  const cleanName = n => String(n).replace(/\s*\(.*?\)\s*/g, " ").replace(/\s+/g, " ").trim();
  function slug(s) {
    s = String(s).replace(/\(.*?\)/g, "").trim().toLowerCase();
    s = s.replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    return s || "ex";
  }
  const entryPath  = (date, dayKey, exName) => `${LOG_DIR}/${date}__${dayKey}__${slug(exName)}.json`;
  const entryKey   = (date, dayKey, ex) => `${date}|${dayKey}|${ex}`;
  const sessionKey = (date, dayKey) => `${date}__${dayKey}`;
  function todayISO() {
    const d = new Date(); const p = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }
  const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  function parseSeconds(txt) {
    const t = String(txt || "").trim().toLowerCase();
    const mm = t.match(/^(\d+):(\d{1,2})$/);
    if (mm) return parseInt(mm[1], 10) * 60 + parseInt(mm[2], 10);
    const sec = t.match(/(\d+)\s*(?:s|sec)\b/);
    if (sec) return parseInt(sec[1], 10);
    const min = t.match(/(\d+)\s*(?:m|min)\b/);
    if (min) return parseInt(min[1], 10) * 60;
    return null;
  }
  function beep(freq = 880, ms = 200) {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
      const ac = new Ctx(); const o = ac.createOscillator(); const g = ac.createGain();
      o.frequency.value = freq; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.18, ac.currentTime); o.start();
      o.stop(ac.currentTime + ms / 1000); setTimeout(() => ac.close(), ms + 220);
    } catch (e) {}
  }
  const numFrom = s => { const m = String(s || "").match(/-?\d+(?:\.\d+)?/); return m ? m[0] : ""; };
  const roundLabel = n => `${n} round${n === 1 ? "" : "s"}`;

  const GEARS = [
    { id: "red", label: "Base" }, { id: "blue", label: "Easy" },
    { id: "room", label: "Room" }, { id: "blue-r", label: "Lazy" },
  ];
  const roundsForGear = g => g === "red" ? 3 : g === "blue" ? 2 : g === "room" ? 1 : 0;
  function restSecFor(block, indexInBlock = 0) {
    if (block === "warmup") return 30;
    if (block === "ss") return indexInBlock === 0 ? 90 : 60;
    if (block === "finisher") return 60;
    return null;
  }
  const defaultLogMode = block =>
    (block === "warmup" || block === "cool") ? "none" : block === "ss" ? "full" : "check";
  function fmtHeaderDate(d) {
    const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return `${days[d.getDay()]} ${months[d.getMonth()]} ${d.getDate()}`;
  }
  const focusOf = day => (String(day.title || "").split("—")[1] || day.type || "").trim();

  /* ---- state ---- */
  let DATE = todayISO(), WW = {}, logIndex = new Map();
  let gear = "red", active = 0;
  let holdInterval = null, holdBtn = null;

  function historyFor(canon) {
    return log.filter(e => e.exercise === canon && e.date < DATE && (e.weight || e.reps))
              .sort((a, b) => a.date.localeCompare(b.date));
  }
  const lastLogged = canon => { const h = historyFor(canon); return h.length ? h[h.length - 1] : null; };
  function resolveMovement(name) {
    const k = cleanName(name);
    if (WW[k]) return WW[k];
    const lower = k.toLowerCase();
    const hit = Object.keys(WW).find(x => x.toLowerCase() === lower);
    return hit ? WW[hit] : null;
  }

  /* ---- saves: append-only entry files, committed through the rails ---- */
  const pending = new Map(); let saveTimer = null;
  function queueSave(dayKey, exercise, patch) {
    const k = entryKey(DATE, dayKey, exercise);
    const cur = pending.get(k) || { ...(logIndex.get(k) || { done: false, weight: "", reps: "", time: "" }) };
    pending.set(k, { ...cur, ...patch, _day: dayKey, _ex: exercise, _gear: gear });
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSaves, 600);
  }
  async function flushSaves() {
    saveTimer = null;
    if (pending.size === 0) return;
    const batch = new Map(pending);
    pending.clear();
    for (const [k, p] of batch) {
      const exName = p._ex;
      const entry = {
        date: DATE, day: p._day, exercise: exName,
        done: !!p.done, weight: p.weight ?? "", reps: p.reps ?? "", time: p.time ?? "",
        gear: p._gear || gear,
      };
      const fpath = entryPath(DATE, p._day, exName);
      const empty = !entry.done && !entry.weight && !entry.reps && !entry.time;
      try {
        if (empty) {
          await deleteFile(fpath, `workout: clear ${exName} ${DATE} [site]`);
          logIndex.delete(k);
          log = log.filter(e => entryKey(e.date, e.day, e.exercise) !== k);
        } else {
          await writeRaw(fpath, JSON.stringify(entry, null, 2) + "\n", `workout: log ${exName} ${DATE} [site]`);
          logIndex.set(k, entry);
          log = log.filter(e => entryKey(e.date, e.day, e.exercise) !== k).concat([entry]);
        }
        syncDotFlash(true);
      } catch (e) {
        console.warn("[workout] save failed", fpath, e);
        toast(`Save failed: ${exName} — will need a retry`);
        syncDotFlash(false);
      }
    }
    /* the PC widget rebuilds workout-log.json (derived cache) from the folder;
       the site leaves the cache alone — folder entries are the source of truth. */
  }
  async function writeSessions() {
    try {
      sessions = await saveJSON(SESSIONS_PATH, cur => {
        const merged = (cur && typeof cur === "object") ? cur : {};
        /* apply our local truth for today's key only — never clobber other days */
        for (const key of Object.keys(localSessionTouches)) {
          if (localSessionTouches[key]) merged[key] = true; else delete merged[key];
        }
        return merged;
      }, `workout: session flags ${DATE} [site]`);
      syncDotFlash(true);
    } catch (e) {
      console.warn("[workout] sessions write failed", e);
      toast("Session flag save failed");
      syncDotFlash(false);
    }
  }
  const localSessionTouches = {};
  function syncDotFlash(ok) {
    const dot = $("sync-dot");
    dot.className = ok ? "ok" : "err";
  }

  /* ---- data load ---- */
  async function loadAll() {
    const w = await readFile(WEEK_PATH);
    if (!w || !w.data || !Array.isArray(w.data.days)) throw new Error(`Could not load ${WEEK_PATH}`);
    week = w.data; WW = week.working_weights || {};
    const cache = await readFile(LOG_PATH);
    log = (cache && Array.isArray(cache.data)) ? cache.data : [];
    /* today's entry files are fresher than the cache — overlay them */
    const files = await listDir(LOG_DIR);
    const todays = files.filter(f => f.name.startsWith(DATE) && f.name.endsWith(".json"));
    for (const f of todays) {
      try {
        const e = await readFile(f.path);
        shaMap.set(f.path, e.sha);
        if (e.data && e.data.date && e.data.day && e.data.exercise) {
          const k = entryKey(e.data.date, e.data.day, e.data.exercise);
          log = log.filter(x => entryKey(x.date, x.day, x.exercise) !== k).concat([e.data]);
        }
      } catch (_) {}
    }
    const s = await readFile(SESSIONS_PATH);
    sessions = (s && s.data && typeof s.data === "object") ? s.data : {};
    logIndex = new Map();
    for (const e of log) {
      if (e && e.date === DATE && e.day && e.exercise) logIndex.set(entryKey(e.date, e.day, e.exercise), e);
    }
  }

  /* ---- UI (ported) ---- */
  function openLightbox(src, alt) {
    if (!lightbox) {
      lightbox = el(root, "div", "lightbox");
      lightbox._img = el(lightbox, "img");
      lightbox._cap = el(lightbox, "div", "cap");
      lightbox.onclick = () => lightbox.classList.remove("on");
    }
    lightbox._img.src = src; lightbox._img.alt = alt || "";
    lightbox._cap.textContent = alt || "";
    lightbox.classList.add("on");
  }

  function toggleTrend(parent, canon) {
    const existing = parent.querySelector(".trend");
    if (existing) { existing.remove(); return; }
    const pts = historyFor(canon)
      .map(e => parseFloat(String(e.weight).replace(/[^0-9.]/g, "")))
      .filter(v => !isNaN(v)).slice(-8);
    const box = el(parent, "div", "trend");
    if (pts.length < 2) { el(box, "span", "trendlab", "not enough history yet"); return; }
    const w = 190, h = 40, pad = 4;
    const min = Math.min(...pts), max = Math.max(...pts), rng = (max - min) || 1;
    const X = i => pad + i * (w - 2 * pad) / (pts.length - 1);
    const Y = v => h - pad - ((v - min) / rng) * (h - 2 * pad);
    const d = pts.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
    const NS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`); svg.setAttribute("width", w); svg.setAttribute("height", h);
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", d); path.setAttribute("fill", "none");
    path.setAttribute("stroke", "var(--gold)"); path.setAttribute("stroke-width", "1.5");
    path.setAttribute("stroke-linejoin", "round"); path.setAttribute("stroke-linecap", "round");
    svg.appendChild(path); box.appendChild(svg);
    el(box, "span", "trendlab", `${min}→${max} kg · ${pts.length} logs`);
  }

  function startHold(dayKey, canon, sec, btn) {
    if (holdInterval) {
      clearInterval(holdInterval); holdInterval = null;
      if (holdBtn) { holdBtn.classList.remove("run"); holdBtn.textContent = holdBtn._idle || ""; }
    }
    let rem = sec; holdBtn = btn;
    btn.classList.add("run"); btn.classList.remove("fin"); btn.textContent = fmt(rem);
    holdInterval = setInterval(() => {
      rem -= 1;
      if (rem <= 0) {
        clearInterval(holdInterval); holdInterval = null;
        btn.classList.remove("run"); btn.classList.add("fin");
        btn._idle = `✓ ${sec}s`; btn.textContent = btn._idle;
        beep(660, 300);
        queueSave(dayKey, canon, { time: `${sec}s` });
      } else { btn.textContent = fmt(rem); }
    }, 1000);
  }

  function movementCard(parent, dayKey, item, opts) {
    const canon = cleanName(item.n);
    const meta  = resolveMovement(item.n) || {};
    const mode  = item.log || opts.mode || "check";
    const saved = logIndex.get(entryKey(DATE, dayKey, canon)) || {};

    const card = el(parent, "div", "mc");
    const fig = el(card, "div", "mcfig");
    const imgPath = Array.isArray(meta.form) ? meta.form[0] : meta.form;
    if (imgPath) {
      const img = el(fig, "img");
      img.alt = `${canon} form`; img.loading = "lazy";
      imageURL(imgPath)
        .then(u => { img.src = u; img.onclick = () => openLightbox(u, canon); })
        .catch(() => { fig.textContent = ""; el(fig, "div", "mcph", "form pic"); });
    } else {
      el(fig, "div", "mcph", "form pic");
    }

    const body = el(card, "div", "mcbody");
    const head = el(body, "div");
    const kick = el(head, "div", "mckicker");
    el(kick, "div", "mcrule");
    el(kick, "span", "mckick", `${opts.section} · ${String(opts.index + 1).padStart(2, "0")}`);
    el(head, "div", "mcname", item.n);

    const load = item.l || meta.load || "";
    const reps = item.r || meta.reps || "";
    const mline = el(head, "div", "mcmeta");
    if (meta.equipment) el(mline, "span", null, meta.equipment);
    if (item.rounds) el(mline, "span", "mcrx", roundLabel(item.rounds));
    const showLoad = load && !/^bodyweight$/i.test(load.trim());
    const rx = [showLoad ? load : "", reps].filter(Boolean).join(" × ");
    if (rx) el(mline, "span", "mcrx", rx);
    if (opts.rest) el(mline, "span", null, `${opts.rest}s rest`);

    if (Array.isArray(meta.cues) && meta.cues.length) {
      const cw = el(body, "div");
      el(cw, "div", "mccuet", "Execution cues");
      const ul = el(cw, "ul", "mccues");
      meta.cues.forEach((q, i) => {
        const li = el(ul, "li", "mccue");
        el(li, "span", "mccuen", String(i + 1).padStart(2, "0"));
        el(li, "span", null, q);
      });
    }

    if (mode === "full") {
      const last = lastLogged(canon);
      const ctrl = el(body, "div", "mcctrl");
      const wf = el(ctrl, "div", "field");
      el(wf, "span", "fieldlab", "Weight kg");
      const wIn = el(wf, "input", "inp");
      wIn.type = "text"; wIn.inputMode = "decimal"; wIn.placeholder = "—";
      wIn.value = (saved.weight != null && saved.weight !== "") ? saved.weight
                : (last && last.weight ? last.weight : numFrom(load));
      const rf = el(ctrl, "div", "field");
      el(rf, "span", "fieldlab", "Reps");
      const rIn = el(rf, "input", "inp");
      rIn.type = "text"; rIn.inputMode = "numeric"; rIn.placeholder = "—";
      rIn.value = (saved.reps != null && saved.reps !== "") ? saved.reps
                : (last && last.reps ? last.reps : numFrom(reps));
      const push = () => queueSave(dayKey, canon, { weight: wIn.value.trim(), reps: rIn.value.trim() });
      for (const i of [wIn, rIn]) { i.addEventListener("change", push); i.addEventListener("blur", push); }
      const foot = el(body, "div", "mcfoot");
      el(foot, "span", null, last ? `Previous log: ${last.weight || "—"}${last.reps ? ` × ${last.reps}` : ""}` : "No previous log");
      const dots = el(foot, "span", "dots", "· · ·");
      dots.onclick = () => toggleTrend(body, canon);
    } else if (mode === "hold") {
      const sec = parseSeconds(item.r) ?? parseSeconds(meta.reps);
      const ctrl = el(body, "div", "mcctrl");
      if (sec) {
        const btn = el(ctrl, "button", "hold", saved.time ? `✓ ${saved.time}` : `▶ ${sec}s`);
        btn._idle = btn.textContent;
        if (saved.time) btn.classList.add("fin");
        btn.onclick = () => startHold(dayKey, canon, sec, btn);
      } else {
        el(ctrl, "span", "trendlab", "timed hold — no duration parsed");
      }
    }
    return card;
  }

  function movementGrid(parent, dayKey, items, opts) {
    const grid = el(parent, "div", "grid");
    (items || []).forEach((it, i) => movementCard(grid, dayKey, it, { ...opts, index: i }));
    return grid;
  }
  function sectionHead(parent, title, meta) {
    const s = el(parent, "div", "section");
    const h = el(s, "div", "shead");
    el(h, "span", "stitle", title);
    el(h, "div", "srule");
    if (meta) el(h, "span", "smeta", meta);
    return s;
  }
  function yogaRow(parent, dayKey) {
    const canon = "Yoga";
    const box = el(parent, "div", "yoga");
    const saved = logIndex.get(entryKey(DATE, dayKey, canon)) || {};
    const tick = el(box, "button", "tick", saved.done ? "✓" : "");
    tick.dataset.on = saved.done ? "1" : "0";
    tick.onclick = () => {
      const on = tick.dataset.on !== "1";
      tick.dataset.on = on ? "1" : "0"; tick.textContent = on ? "✓" : "";
      queueSave(dayKey, canon, { done: on });
    };
    el(box, "span", "yogatxt", "Yoga / mobility — counts as the day's mobility");
  }
  function sessionBar(parent, dayKey) {
    const bar = el(parent, "div", "sessionbar");
    const k = sessionKey(DATE, dayKey);
    const btn = el(bar, "button", "sessionbtn");
    const paint = () => {
      const on = !!sessions[k];
      btn.dataset.on = on ? "1" : "0";
      btn.textContent = on ? `✓ Session complete · ${DATE}` : "Mark session complete";
    };
    paint();
    btn.onclick = async () => {
      if (saveTimer) { clearTimeout(saveTimer); await flushSaves(); }
      const on = !sessions[k];
      if (on) sessions[k] = true; else delete sessions[k];
      localSessionTouches[k] = on;
      paint();
      await writeSessions();
      paint();
    };
  }

  async function renderDay() {
    if (holdInterval) { clearInterval(holdInterval); holdInterval = null; holdBtn = null; }
    if (saveTimer) { clearTimeout(saveTimer); await flushSaves(); }
    tabEls.forEach((t, i) => t.dataset.on = i === active ? "1" : "0");
    host.textContent = "";

    const d = week.days[active];
    const isStrength = d.type === "strength";
    const rounds = roundsForGear(gear);
    const showRounds = Math.max(1, rounds);

    if (gear === "blue-r" && isStrength && d.just_move) {
      const head = el(host, "div", "dhead");
      el(head, "div", "dtitle", d.just_move.title);
      el(head, "div", "dtag", "strength day · Lazy — swap the lift for a walk + mobility");
      const s = sectionHead(host, "Just move", "");
      const jm = el(s, "div", "jm");
      (d.just_move.items || []).forEach((it, i) => {
        const row = el(jm, "div", "jmitem");
        el(row, "span", "jmn", String(i + 1).padStart(2, "0"));
        el(row, "span", null, it);
      });
      if (d.note) el(host, "div", "note", d.note);
      sessionBar(host, d.key);
      return;
    }

    const room = (gear === "room" && week.room_session) ? week.room_session : null;
    const src = room || d;

    const head = el(host, "div", "dhead");
    el(head, "div", "dtitle", room ? room.title : d.title);
    el(head, "div", "dtag", (room ? room.tag : d.tag) || "");

    if (Array.isArray(src.warmup) && src.warmup.length) {
      const s = sectionHead(host, "Warm-up", `${restSecFor("warmup")}s between`);
      movementGrid(s, d.key, src.warmup, { section: "Warm-up", mode: defaultLogMode("warmup") });
    }
    if (src.engine) {
      const s = sectionHead(host, "Engine", "");
      el(s, "div", "prose", src.engine);
    }
    (src.ss || []).forEach((block, bi) => {
      const r    = room ? (block.rounds ?? showRounds) : showRounds;
      const rest = room ? (block.rest ?? 60) : restSecFor("ss", bi);
      const s = sectionHead(host, block.label || `Superset ${bi + 1}`, `${roundLabel(r)} · ${rest}s rest`);
      movementGrid(s, d.key, block.ex, { section: block.label || "Superset", mode: defaultLogMode("ss"), rest });
    });
    if (Array.isArray(src.finisher) && src.finisher.length) {
      const label = d.type === "engine" && !room ? "Core" : "Finisher";
      const perItem = (src.finisher || []).some(f => f.rounds);
      const s = sectionHead(host, label,
        perItem ? `${restSecFor("finisher")}s rest`
                : `${roundLabel(showRounds)} · ${restSecFor("finisher")}s rest`);
      movementGrid(s, d.key, src.finisher, { section: label, mode: defaultLogMode("finisher"), rest: restSecFor("finisher") });
    }
    if (Array.isArray(src.cool) && src.cool.length) {
      const s = sectionHead(host, "Cool-down", "");
      movementGrid(s, d.key, src.cool, { section: "Cool-down", mode: defaultLogMode("cool") });
    }
    yogaRow(host, d.key);
    const note = room ? room.note : d.note;
    if (note) el(host, "div", "note", note);
    sessionBar(host, d.key);
  }

  async function mount() {
    if (mounted) return;
    const container = $("view-workout");
    container.textContent = "";
    root = el(container, "div", "wkt");
    const loading = el(root, "div", "sub", "Loading week from repo…");
    try {
      DATE = todayISO();
      await loadAll();
    } catch (e) {
      loading.textContent = `⚠ ${e.message}`;
      return;
    }
    mounted = true;
    root.textContent = "";

    gear = (() => {
      try {
        const s = JSON.parse(localStorage.getItem("wkt-gear") || "null");
        if (s && s.date === DATE && GEARS.some(g => g.id === s.id)) return s.id;
      } catch (_) {}
      return "red";
    })();
    active = (() => {
      const mondayFirst = (new Date().getDay() + 6) % 7;
      return (mondayFirst >= 0 && mondayFirst < week.days.length) ? mondayFirst : 0;
    })();

    const hdr = el(root, "div", "hdr");
    const hleft = el(hdr, "div");
    el(hleft, "div", "kick", "Renovatio · Codex Corporis");
    el(hleft, "div", "brand", "Workout");
    el(hdr, "span", "hdate", fmtHeaderDate(new Date()));
    el(root, "div", "sub", week.week_label || "");

    if (week.review_due && DATE > week.review_due) {
      el(root, "div", "stale",
        `⚠ Plan week ended ${week.review_due} — run /workout-review to roll the week. Cards below still show the old week's plan.`);
    }

    const tabs = el(root, "div", "tabs");
    tabEls = [];
    week.days.forEach((d, i) => {
      const name = String(d.tab).split(" ")[0];
      const t = el(tabs, "button", "tab");
      t.dataset.on = i === active ? "1" : "0";
      el(t, "div", "tabname", name);
      el(t, "div", "tabsub", focusOf(d));
      t.onclick = () => { active = i; renderDay(); };
      tabEls.push(t);
    });

    const gutter = el(root, "div", "gutter");
    el(gutter, "span", "label", "Intensity");
    const gearBox = el(gutter, "div", "gears");
    gearEls = {};
    for (const g of GEARS) {
      const b = el(gearBox, "button", "gear", g.label);
      b.dataset.on = g.id === gear ? "1" : "0";
      b.onclick = () => {
        gear = g.id;
        try { localStorage.setItem("wkt-gear", JSON.stringify({ date: DATE, id: gear })); } catch (_) {}
        for (const id in gearEls) gearEls[id].dataset.on = id === gear ? "1" : "0";
        renderDay();
      };
      gearEls[g.id] = b;
    }

    host = el(root, "div");
    renderDay();
  }

  return { mount };
})();

/* ====================================================================
   FOOD — port of orgs/health/Food.md (Renovatio prep-batch composer).
   Same data files, same engine. Obsidian vault I/O swapped for the repo
   rails; every write is a commit tagged [site].
   ==================================================================== */
const Food = (() => {
  let mounted = false;

  const DATA_PATH   = "orgs/health/data/food-proto.json";
  const EXPORT_PATH = "orgs/health/data/shopping-list.json";
  const SPEND_PATH  = "orgs/health/data/grocery-spend.json";
  const INV_PATH    = "orgs/health/data/inventory.json";

  async function readJSON(path, fallback) {
    try {
      const f = await readFile(path);
      return f ? f.data : fallback;
    } catch (e) { console.warn("[food] read failed", path, e); return fallback; }
  }
  const writeJSON = (path, obj, msg) => writeRaw(path, JSON.stringify(obj, null, 2) + "\n", msg);

  async function mount() {
    if (mounted) return;
    const container = $("view-food");
    container.empty();
    const boot = container.createDiv({ cls: "food" });
    const loading = boot.createDiv({ text: "Loading kitchen from repo…" });
    loading.style.cssText = "font-family:var(--mono);font-size:12px;color:var(--faint);padding:14px 0";

    const data    = await readJSON(DATA_PATH, null);
    const mealsDb = await readJSON("orgs/health/data/meals.json", null);
    const ingDb   = await readJSON("orgs/health/data/ingredients.json", null);
    const invDb   = await readJSON(INV_PATH, null);
    const packDb  = await readJSON("orgs/health/data/packs.json", null);

    container.empty();
    const root = container;
    mounted = true;
    run(root, { data, mealsDb, ingDb, invDb, packDb });
  }

  /* ---- the ported widget (body kept as close to Food.md as possible) ---- */
  function run(root, db) {
    const { data, mealsDb, ingDb, invDb, packDb } = db;

    function todayISO() {
      const d = new Date(), p = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    }
    async function writeInventory() {
      invDb.last_updated = todayISO();
      await writeJSON(INV_PATH, invDb, `food: inventory update ${todayISO()} [site]`);
    }

    let RECIPES, INVENTORY, LOWSTOCK;
    if (mealsDb && Array.isArray(mealsDb.meals) && mealsDb.meals.length && ingDb && Array.isArray(ingDb.ingredients)) {
      const ingById = new Map(ingDb.ingredients.map(i => [i.id, i]));
      const vendorOf = (src) => {
        const t = String(src || "").split(/[(/;,]/)[0].trim();
        if (/^(TJ|Trader)/i.test(t)) return "Trader Joe's";
        if (/^Weee/i.test(t)) return "Weee";
        if (/^Amazon/i.test(t)) return "Amazon";
        if (/^Costco/i.test(t)) return "Costco";
        return "Other";
      };
      const roleOf = (m) => m.role === "veg_side" ? "side" : m.role === "carb_side" ? "base" : "main";
      RECIPES = mealsDb.meals.map(m => {
        const hasAmounts = (m.ingredients || []).some(e => e.amount);
        return {
          id: m.id, name: m.name, subtitle: m.subtitle || null, role: roleOf(m), slot: m.meal_slot,
          prep_min: m.prep_min || null,
          base_servings: hasAmounts ? (m.batch_servings || 1) : 1,
          maxBatch: m.max_batch_servings || null,
          derived_totals: m.derived_totals || null, tags: m.tags || [],
          macro_target: m.macro_target || null, versions: m.versions || [],
          ingredients: m.ingredients.map(e => {
            const i = ingById.get(e.ingredient_id) || {};
            return {
              name: i.name || e.ingredient_id, qty: e.qty, unit: i.unit || "", cat: i.storage || "",
              amount: e.amount || null,
              basis: i.basis || null, unitSize: i.unit_size || 0, piece: i.piece || null,
              yieldRatio: i.yield_ratio || null, buyBasis: i.buy_basis || null,
              vendor: vendorOf(i.source), link: i.link, asin: i.asin, alts: i.alts,
              per: { price: i.unit_price || 0, cal: i.calories || 0, p: i.protein_g || 0, c: i.carbs_g || 0, f: i.fat_g || 0 },
              price: (i.unit_price || 0) * e.qty,
              cal: (i.calories || 0) * e.qty, p: (i.protein_g || 0) * e.qty,
              c: (i.carbs_g || 0) * e.qty, f: (i.fat_g || 0) * e.qty
            };
          }),
          steps: m.steps || (m.method ? [m.method] : [])
        };
      });
      INVENTORY = {};
      LOWSTOCK = new Set();
      ((invDb && invDb.stock) || []).forEach(s => {
        if (s.qty_on_hand > 0) {
          const i = ingById.get(s.ingredient_id);
          if (i) {
            INVENTORY[i.name] = s.note || `${s.qty_on_hand} ${s.unit} on hand`;
            if (s.min_qty != null && s.qty_on_hand <= s.min_qty) LOWSTOCK.add(i.name);
          }
        }
      });
    } else {
      root.createDiv({ text: "⚠️ No data: need orgs/health/data/meals.json + ingredients.json." });
      return;
    }

    const ID_BY_NAME = new Map((ingDb.ingredients || []).map(g => [g.name, g.id]));
    const ING_BY_ID  = new Map((ingDb.ingredients || []).map(g => [g.id, g]));
    const PACK_BY_ID = new Map(((packDb && packDb.packs) || []).map(p => [p.ingredient_id, p]));

    function needIn(item, want) {
      const a = item.amount;
      if (a) {
        if (item.noAmtLines) return null;
        if (want === "count") return a.ct != null ? a.ct : null;
        return a[want] != null ? a[want] : null;
      }
      return want === "count" && item.qty > 0 ? item.qty : null;
    }
    function packInfo(item) {
      const id = ID_BY_NAME.get(item.name);
      if (!id) return null;
      const row = PACK_BY_ID.get(id);
      if (row) {
        if (row.pack_class === "staple" || row.pack_qty == null) return null;
        if (row.vendor && item.vendor && row.vendor !== item.vendor) {
          const src = String((ING_BY_ID.get(id) || {}).source || "");
          const alias = row.vendor === "Trader Joe's" ? /trader|tj\b/i
                      : new RegExp(row.vendor.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i");
          if (!alias.test(src)) return null;
        }
        const bridged = row.recipe_unit && row.pack_in_recipe_units > 0;
        const wantUnit = bridged ? row.recipe_unit : (row.pack_basis === "count" ? "count" : row.pack_unit);
        const perPack = bridged ? row.pack_in_recipe_units : row.pack_qty;
        const need = needIn(item, wantUnit);
        if (!(need > 0)) return null;
        const packs = Math.max(1, Math.ceil(need / perPack));
        const unit = row.pack_unit === "count" ? "" : " " + row.pack_unit;
        return {
          packs, need, basis: row.pack_basis, src: bridged ? "packs.json (bridged)" : "packs.json",
          label: `${row.pack_qty}${unit}`,
          needText: item.amount ? fmtAmount(item.amount, 1) : unitPhrase(item.qty, item.unit),
          cost: row.pack_price_usd != null ? packs * row.pack_price_usd : null,
          over: (packs * perPack - need) / (packs * perPack),
          provenance: row.provenance, product: row.product
        };
      }
      const g2 = ING_BY_ID.get(id);
      const spp = g2 && Number(g2.servings_per_pack);
      const need = needIn(item, "count");
      if (!spp || !(need > 0)) return null;
      const packs = Math.max(1, Math.ceil(need / spp));
      return {
        packs, need, basis: "count", src: "servings_per_pack",
        label: g2.pack_size || `${spp} × ${g2.unit || "unit"}`,
        needText: item.amount ? fmtAmount(item.amount, 1) : unitPhrase(item.qty, item.unit),
        cost: g2.pack_price != null ? packs * g2.pack_price : null,
        over: (packs * spp - need) / (packs * spp),
        provenance: g2.price_confirmed ? "confirmed" : "estimate",
        product: g2.sku || null
      };
    }
    const lineCost = (i) => (i.pack && i.pack.cost != null) ? i.pack.cost : i.price;

    let spendLog = Array.isArray(db.spendLog) ? db.spendLog : [];
    readJSON(SPEND_PATH, []).then(s => { if (Array.isArray(s)) { spendLog = s; renderSpend(); } });

    function weekStartISO(d) {
      const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
      const p = n => String(n).padStart(2, "0");
      return `${x.getFullYear()}-${p(x.getMonth() + 1)}-${p(x.getDate())}`;
    }

    const TARGETS = (data && data.targets) || { cal_day: 1600, protein_day: 150, meals_per_day: 3 };
    const MEAL_TARGET = { cal: Math.round(TARGETS.cal_day / TARGETS.meals_per_day), p: Math.round(TARGETS.protein_day / TARGETS.meals_per_day) };
    const byId = new Map(RECIPES.map(r => [r.id, r]));
    const maxSrv = r => r.maxBatch || 12;

    const filt = { q: "", meal: null, cuisine: new Set(), type: new Set(), maxCost: null, minProtein: null, maxCal: null, inPlan: false, pantry: false };
    const plan = new Map();
    const vendorPick = new Map();
    const skipSet = new Set();
    const PLAN_KEY = "secundus-food-plan-v1";
    function savePlan() {
      try { localStorage.setItem(PLAN_KEY, JSON.stringify({
        plan: [...plan].map(([id, e]) => [id, { servings: e.servings, ver: e.ver || null, qtys: [...(e.qtys || new Map())] }]),
        skips: [...skipSet], vendors: [...vendorPick]
      })); } catch (e) {}
    }
    function loadPlan() {
      try {
        const raw = localStorage.getItem(PLAN_KEY);
        if (!raw) return;
        const d = JSON.parse(raw);
        const entries = Array.isArray(d) ? d : (d.plan || []);
        entries.forEach(([id, e]) => {
          if (!byId.has(id)) return;
          const r = byId.get(id);
          const ver = e.ver && (r.versions || []).some(v => v.id === e.ver) ? e.ver : null;
          plan.set(id, { servings: e.servings || r.base_servings, ver, qtys: new Map(e.qtys || []) });
        });
        if (!Array.isArray(d)) {
          (d.skips || []).forEach(k => skipSet.add(k));
          (d.vendors || []).forEach(([k, v]) => vendorPick.set(k, v));
        }
      } catch (e) {}
    }
    loadPlan();
    let modalId = null, modalVer = null;

    const VENDOR_SEARCH = {
      "Weee":         q => `https://www.sayweee.com/en/search?keyword=${encodeURIComponent(q)}`,
      "Costco":       q => `https://www.costco.com/CatalogSearch?keyword=${encodeURIComponent(q)}`,
      "Trader Joe's": q => `https://www.traderjoes.com/home/search?q=${encodeURIComponent(q)}`,
      "Amazon":       q => `https://www.amazon.com/s?k=${encodeURIComponent(q)}`
    };
    const itemUrl = (item) => {
      const opt = item.options.get(item.vendor) || {};
      if (opt.link) return opt.link;
      if (opt.asin) return `https://www.amazon.com/dp/${opt.asin}`;
      const s = VENDOR_SEARCH[item.vendor];
      return s ? s(item.name) : null;
    };

    const QTY_MAX = 999;
    const OZ = 28.35, FLOZ = 29.574, TBSP = 14.79, TSP = 4.93, CUP = 236.6;
    function unitViews(ing, amt) {
      if (!ing.basis || ing.basis === "none" || !ing.unitSize) return null;
      const vol = ing.basis === "volume";
      const views = {
        metric:   { amt, per: 1, abbr: vol ? "ml" : "g" },
        imperial: { amt: amt / (vol ? FLOZ : OZ), per: vol ? FLOZ : OZ, abbr: vol ? "floz" : "oz" },
        unit:     null
      };
      if (ing.piece && ing.piece.size) {
        views.unit = { amt: amt / ing.piece.size, per: ing.piece.size, abbr: ing.piece.abbr };
      } else if (vol) {
        const [per, abbr] = amt >= CUP ? [CUP, "cup"] : amt >= TBSP ? [TBSP, "tbsp"] : [TSP, "tsp"];
        views.unit = { amt: amt / per, per, abbr };
      }
      return views;
    }
    function fmtAmt(v) {
      if (!isFinite(v)) return "";
      const a = Math.abs(v);
      return String(Number(v.toFixed(a >= 100 ? 0 : a >= 10 ? 1 : 2)));
    }
    function parseQtyInput(raw, max) {
      const s = String(raw ?? "").trim();
      if (s === "") return { reset: true };
      const v = Number(s);
      if (!Number.isFinite(v)) return { error: "not a number" };
      if (v < 0) return { error: "cannot be negative" };
      if (v > max) return { error: `over ${max} — check the unit` };
      return { qty: v };
    }

    function planEntry(id) {
      if (!plan.has(id)) plan.set(id, { servings: byId.get(id).base_servings, qtys: new Map() });
      const e = plan.get(id);
      if (!e.qtys) e.qtys = new Map();
      return e;
    }
    function withQty(ing, q) {
      const amount = (ing.amount && ing.qty > 0) ? scaleAmount(ing.amount, q / ing.qty) : null;
      return { ...ing, qty: q, amount, price: ing.per.price * q, cal: ing.per.cal * q, p: ing.per.p * q, c: ing.per.c * q, f: ing.per.f * q };
    }
    function scaleAmount(a, k) {
      const out = {};
      if (a.g != null) out.g = a.g * k;
      if (a.ml != null) out.ml = a.ml * k;
      if (a.ct != null) { out.ct = a.ct * k; if (a.u) out.u = a.u; }
      return out;
    }
    const versionOf = (r, verId) => verId ? (r.versions || []).find(v => v.id === verId) : null;
    function effectiveIngredients(r, qtys) {
      return r.ingredients.map(ing => {
        const q = qtys ? qtys.get(ing.name) : undefined;
        return (q === undefined || q === ing.qty || !ing.per) ? ing : withQty(ing, q);
      });
    }
    function perServing(r, qtys) {
      const ings = effectiveIngredients(r, qtys);
      const t = { cal: 0, p: 0, c: 0, f: 0, cost: 0 };
      for (const i of ings) { t.cal += i.cal || 0; t.p += i.p || 0; t.c += i.c || 0; t.f += i.f || 0; t.cost += i.price || 0; }
      const n = r.base_servings;
      return { cal: t.cal / n, p: t.p / n, c: t.c / n, f: t.f / n, cost: t.cost / n };
    }
    function targetFit(r, ps) {
      const t = r.macro_target; if (!t) return null;
      if (t.kind === "treat") return { cls: "fit-treat", text: "treat" };
      const calHi = t.calories && t.calories[1];
      if (!t.protein_g) {
        if (!calHi) return { cls: "fit-ok", text: `${Math.round(ps.cal)} cal` };
        return ps.cal <= calHi + 1 ? { cls: "fit-ok", text: "light" } : { cls: "fit-warn", text: `⚠ ${Math.round(ps.cal)} cal` };
      }
      const pLo = t.protein_g[0];
      const okP = ps.p >= pLo - 0.5, okC = !calHi || ps.cal <= calHi + 1;
      if (okP && okC) return { cls: "fit-ok", text: "✓ on target" };
      if (!okP) return { cls: "fit-warn", text: `⚠ ${Math.round(ps.p)}/${pLo}g protein` };
      return { cls: "fit-warn", text: `⚠ ${Math.round(ps.cal)} cal` };
    }
    function plateMacros(r, qtys, verId) {
      const ps = perServing(r, qtys);
      const recipeQty = new Map(r.ingredients.map(i => [i.name, i.qty]));
      const hasActiveQty = qtys && [...qtys].some(([n, q]) => q !== undefined && q !== recipeQty.get(n));
      const ver = versionOf(r, verId);
      const dt = (ver && ver.derived_totals) || r.derived_totals;
      if (dt && !hasActiveQty) return { cal: dt.calories, p: dt.protein_g, c: dt.carbs_g, f: dt.fat_g, cost: ps.cost };
      return ps;
    }
    const money = v => "$" + v.toFixed(2);
    const g = v => Math.round(v) + "g";
    function niceNum(n) {
      const whole = Math.floor(n + 1e-6), frac = n - whole;
      const F = [[0,""],[.25,"¼"],[.333,"⅓"],[.5,"½"],[.667,"⅔"],[.75,"¾"],[1,""]];
      let best = F[0], bd = 1;
      for (const f of F) { const d = Math.abs(frac - f[0]); if (d < bd) { bd = d; best = f; } }
      if (bd > 0.04) return (+n.toFixed(2)).toString();
      const w = best[0] === 1 ? whole + 1 : whole;
      return best[1] ? `${w > 0 ? w : ""}${best[1]}` : String(w);
    }
    function fmtAmount(a, scale) {
      if (a.g != null) {
        const gg = a.g * scale;
        const metric = gg < 1000 ? `${Math.round(gg)} g` : `${(+(gg / 1000).toFixed(2))} kg`;
        const oz = gg / 28.3495;
        const imp = oz < 16 ? `${niceNum(oz)} oz` : `${niceNum(oz / 16)} lb`;
        return `${metric} / ${imp}`;
      }
      if (a.ml != null) {
        const ml = a.ml * scale;
        const metric = ml < 1000 ? `${Math.round(ml)} ml` : `${(+(ml / 1000).toFixed(2))} L`;
        const cup = ml / 236.588;
        let imp;
        if (cup >= 0.25) imp = `${niceNum(cup)} cup`;
        else { const tbsp = ml / 14.7868; imp = tbsp >= 1 ? `${niceNum(tbsp)} tbsp` : `${niceNum(ml / 4.92892)} tsp`; }
        return `${metric} / ${imp}`;
      }
      return `${niceNum((a.ct || 0) * scale)}${a.u ? " " + a.u : ""}`;
    }
    function isEggFree(r) { return !(r.ingredients || []).some(i => /\begg(s)?\b/i.test(i.name)); }
    function unitPhrase(n, unit) {
      if (!unit) return niceNum(n);
      const m = unit.match(/^1\s+(.+)/);
      if (m) return `${niceNum(n)} ${m[1]}`;
      if (Math.abs(n - 1) < 1e-6) return unit;
      return `${niceNum(n)} × ${unit}`;
    }
    function plateGrams(r, qtys) {
      const ings = effectiveIngredients(r, qtys);
      let gg = 0, counted = 0;
      for (const i of ings) {
        if (!i.unitSize || !i.basis || i.basis === "none") continue;
        gg += i.qty * i.unitSize; counted++;
      }
      return { g: gg / r.base_servings, counted, total: ings.length };
    }
    function plateGramsText(r, qtys) {
      const w = plateGrams(r, qtys);
      if (!w.counted) return "not weighed";
      const v = `${Math.round(w.g)} g`;
      return w.counted === w.total ? v : `~${v} (${w.counted}/${w.total} lines)`;
    }

    const CUISINES = new Set(["american","chinese","filipino","french","hungarian","indian","indonesian","italian","japanese","korean","middle-eastern","sichuan","spanish","taiwanese","thai","vietnamese"]);
    const MEAL_OF = { breakfast: "Breakfast", lunch_dinner: "Full Meal", side: "Side Dish", dessert: "Dessert", snack: "Side Dish" };
    const MEAL_ORDER = ["Breakfast", "Full Meal", "Side Dish", "Dessert"];
    const TYPE_ORDER = ["Beef", "Pork", "Chicken", "Meat", "Seafood", "Vegetarian", "Vegan", "Egg"];
    const RE_BEEF = /beef|steak|sirloin|ribeye|brisket|chuck|bulgogi|short.?rib|gyudon/i;
    const RE_PORK = /pork|belly|bacon|pancetta|sausage|lap cheong|lardon|\bham\b|char siu|luncheon|spam/i;
    const RE_CHICK = /chicken/i;
    const RE_STOCK = /stock|broth|bouillon|dashi/i;
    const cuisineTags = (r) => (r.tags || []).filter(t => CUISINES.has(t));
    const mealLabel = (r) => MEAL_OF[r.slot] || "Full Meal";
    function proteinTypes(r) {
      const explicit = (r.tags || []).filter(t => /^(beef|pork|chicken)$/i.test(t)).map(t => t[0].toUpperCase() + t.slice(1).toLowerCase());
      if (explicit.length) return [...new Set(explicit)];
      const s = new Set();
      for (const i of (r.ingredients || [])) {
        const nm = i.name || "";
        if (RE_STOCK.test(nm)) continue;
        if (RE_BEEF.test(nm)) s.add("Beef");
        if (RE_PORK.test(nm)) s.add("Pork");
        if (RE_CHICK.test(nm)) s.add("Chicken");
      }
      return [...s];
    }
    function typeTags(r) {
      const t = r.tags || [], out = new Set();
      if (t.includes("vegan")) out.add("Vegan");
      if (t.includes("vegetarian")) out.add("Vegetarian");
      if (t.includes("seafood")) out.add("Seafood");
      if (t.includes("meat")) { const p = proteinTypes(r); if (p.length) p.forEach(x => out.add(x)); else out.add("Meat"); }
      if (!isEggFree(r)) out.add("Egg");
      return TYPE_ORDER.filter(x => out.has(x));
    }
    function activeCount() {
      return (filt.meal ? 1 : 0) + filt.cuisine.size + filt.type.size + (filt.q.trim() ? 1 : 0)
        + (filt.maxCost != null ? 1 : 0) + (filt.minProtein != null ? 1 : 0) + (filt.maxCal != null ? 1 : 0)
        + (filt.inPlan ? 1 : 0) + (filt.pantry ? 1 : 0);
    }
    function pantryFriendly(r) {
      const lines = (r.ingredients || []).filter(i => i.qty > 0);
      if (!lines.length) return false;
      const home = lines.filter(i => INVENTORY[i.name] !== undefined).length;
      return home / lines.length >= 0.5;
    }
    function filtered() {
      const q = filt.q.trim().toLowerCase();
      return RECIPES.filter(r => {
        if (filt.meal && mealLabel(r) !== filt.meal) return false;
        if (filt.cuisine.size && !cuisineTags(r).some(c => filt.cuisine.has(c))) return false;
        if (filt.type.size && !typeTags(r).some(t => filt.type.has(t))) return false;
        if (filt.inPlan && !plan.has(r.id)) return false;
        if (filt.pantry && !pantryFriendly(r)) return false;
        const e = plan.get(r.id);
        const ps = plateMacros(r, e ? e.qtys : null, e ? e.ver : null);
        if (filt.maxCost != null && ps.cost > filt.maxCost) return false;
        if (filt.minProtein != null && ps.p < filt.minProtein) return false;
        if (filt.maxCal != null && ps.cal > filt.maxCal) return false;
        if (q) {
          const hay = [r.name, r.subtitle || "", mealLabel(r), ...cuisineTags(r), ...typeTags(r), ...(r.ingredients || []).map(i => i.name)].join(" ").toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }
    function featuredList(list) {
      const mains = list.filter(r => r.role === "main");
      const pool = mains.length ? mains : list;
      const unplanned = pool.filter(r => !plan.has(r.id));
      const pick = unplanned.length ? unplanned : pool;
      const score = r => { const f = targetFit(r, plateMacros(r, null)); return f && f.cls === "fit-ok" ? 0 : 1; };
      return [...pick].sort((a, b) => score(a) - score(b)).slice(0, 8);
    }

    /* ---- skeleton ---- */
    const wrap = root.createDiv({ cls: "food" });
    const hdr = wrap.createDiv({ cls: "hdr" });
    const hl = hdr.createDiv();
    hl.createDiv({ cls: "kick", text: "Roman Kitchen · Prep-Batch Composer" });
    hl.createDiv({ cls: "brand serif", text: "Renovatio" });
    const hrEl = hdr.createDiv({ cls: "hr" });
    function tPill(label, val) { const p = hrEl.createDiv({ cls: "tpill" }); p.createSpan({ cls: "tl", text: label }); p.createSpan({ cls: "tv", text: String(val) }); }
    tPill("cal / meal", MEAL_TARGET.cal);
    tPill("protein / meal", MEAL_TARGET.p + "g");
    tPill("meals / day", TARGETS.meals_per_day);

    const filtersEl = wrap.createDiv({ cls: "filters" });
    const layout = wrap.createDiv({ cls: "layout" });
    const mainCol = layout.createDiv({ cls: "maincol" });
    const carEl = mainCol.createDiv({ cls: "carousel" });
    const libEl = mainCol.createDiv({ cls: "library" });
    const sideEl = layout.createDiv({ cls: "side" });
    const planPanel = sideEl.createDiv({ cls: "panel" });
    const shopPanel = sideEl.createDiv({ cls: "panel" });
    const spendPanel = sideEl.createDiv({ cls: "panel" });
    const backdrop = wrap.createDiv({ cls: "backdrop" });
    const modal = backdrop.createDiv({ cls: "modal" });
    backdrop.onclick = (e) => { if (e.target === backdrop) { modalId = null; backdrop.removeClass("on"); } };
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && backdrop.hasClass("on")) { modalId = null; backdrop.removeClass("on"); } });

    const ALL_CUISINES = [...new Set(RECIPES.flatMap(cuisineTags))].sort();
    const ALL_MEALS = MEAL_ORDER.filter(m => RECIPES.some(r => mealLabel(r) === m));
    const ALL_TYPES = TYPE_ORDER.filter(t => RECIPES.some(r => typeTags(r).includes(t)));

    let filteredCache = [];
    function renderContent() { filteredCache = filtered(); renderCarousel(); renderLibrary(); }
    function renderAfterPlan() { renderContent(); renderPlan(); renderShop(); }

    let resetChip = null, chipsEl = null;
    function updateReset() {
      if (!resetChip) return;
      const n = activeCount();
      if (n) { resetChip.style.display = ""; resetChip.setText(`reset · ${n}`); }
      else resetChip.style.display = "none";
    }
    function numField(parent, label, key, step) {
      const f = parent.createDiv({ cls: "numf" });
      f.dataset.on = filt[key] != null ? "1" : "0";
      f.createSpan({ cls: "nfl", text: label });
      const inp = f.createEl("input", { cls: "nfi" });
      inp.type = "number"; inp.min = "0"; inp.step = String(step);
      inp.value = filt[key] ?? "";
      inp.oninput = () => {
        filt[key] = inp.value === "" ? null : Number(inp.value);
        f.dataset.on = filt[key] != null ? "1" : "0";
        renderContent(); updateReset();
      };
    }
    function renderChips() {
      chipsEl.empty();
      const row = (label) => { const r = chipsEl.createDiv({ cls: "chiprow" }); r.createSpan({ cls: "flabel", text: label }); return r; };
      const toggleSet = (set, v) => { set.has(v) ? set.delete(v) : set.add(v); renderChips(); renderContent(); updateReset(); };
      const cr = row("cuisine");
      ALL_CUISINES.forEach(c => { const e2 = cr.createDiv({ cls: "pill", text: c }); e2.dataset.on = filt.cuisine.has(c) ? "1" : "0"; e2.onclick = () => toggleSet(filt.cuisine, c); });
      const mr = row("meal");
      const any = mr.createDiv({ cls: "pill", text: "any" });
      any.dataset.on = filt.meal ? "0" : "1";
      any.onclick = () => { filt.meal = null; renderChips(); renderContent(); updateReset(); };
      ALL_MEALS.forEach(m => { const e2 = mr.createDiv({ cls: "pill", text: m }); e2.dataset.on = filt.meal === m ? "1" : "0"; e2.onclick = () => { filt.meal = filt.meal === m ? null : m; renderChips(); renderContent(); updateReset(); }; });
      const tr = row("type");
      ALL_TYPES.forEach(t => { const e2 = tr.createDiv({ cls: "pill", text: t }); e2.dataset.on = filt.type.has(t) ? "1" : "0"; e2.onclick = () => toggleSet(filt.type, t); });
      const qr = row("quick");
      const mkTog = (label, key) => {
        const e2 = qr.createDiv({ cls: "pill", text: label });
        e2.dataset.on = filt[key] ? "1" : "0";
        e2.onclick = () => { filt[key] = !filt[key]; renderChips(); renderContent(); updateReset(); };
      };
      mkTog("in plan", "inPlan");
      mkTog("pantry-friendly", "pantry");
    }
    function buildFilters() {
      filtersEl.empty();
      const sr = filtersEl.createDiv({ cls: "srow" });
      const sw = sr.createDiv({ cls: "searchwrap" });
      const si = sw.createEl("input", { cls: "search" });
      si.type = "text"; si.placeholder = "Search recipes, cuisines, ingredients…"; si.value = filt.q;
      si.oninput = () => { filt.q = si.value; renderContent(); updateReset(); };
      resetChip = sr.createDiv({ cls: "resetchip" });
      resetChip.onclick = () => {
        filt.meal = null; filt.cuisine.clear(); filt.type.clear(); filt.q = "";
        filt.maxCost = filt.minProtein = filt.maxCal = null;
        filt.inPlan = filt.pantry = false;
        buildFilters(); renderContent();
      };
      chipsEl = filtersEl.createDiv({ cls: "chipwrap" });
      const nr = filtersEl.createDiv({ cls: "numrow" });
      nr.createSpan({ cls: "flabel", text: "macros" });
      numField(nr, "max $", "maxCost", 0.5);
      numField(nr, "min P g", "minProtein", 5);
      numField(nr, "max kcal", "maxCal", 50);
      renderChips();
      updateReset();
    }

    function stat(parent, label, val, accent, danger) {
      const c = parent.createDiv({ cls: "stat" });
      c.createDiv({ cls: "statv" + (danger ? " warn" : accent ? " gold" : ""), text: String(val) });
      c.createDiv({ cls: "statl", text: label });
    }
    function buildAddArea(container, r) {
      container.empty();
      if (plan.has(r.id)) {
        const b = container.createEl("button", { cls: "radd on", text: "✓ In plan — remove" });
        b.onclick = (e) => { e.stopPropagation(); plan.delete(r.id); renderAfterPlan(); };
        return;
      }
      let prompting = false, srv = r.base_servings;
      const stage = () => {
        container.empty();
        if (!prompting) {
          const b = container.createEl("button", { cls: "radd", text: "+ Add to plan" });
          b.onclick = (e) => { e.stopPropagation(); prompting = true; stage(); };
          return;
        }
        const box = container.createDiv({ cls: "addbox" });
        const row = box.createDiv({ cls: "addstep" });
        row.createSpan({ cls: "addlab", text: "servings" });
        const st = row.createDiv({ cls: "step" });
        const mn = st.createDiv({ cls: "stepbtn", text: "−" });
        const vv = st.createDiv({ cls: "stepval", text: String(srv) });
        const pl = st.createDiv({ cls: "stepbtn", text: "+" });
        const capWarn = box.createDiv({ cls: "addlab fit-warn" });
        const upd = () => { vv.setText(String(srv)); capWarn.setText(srv > maxSrv(r) ? `⚠ over kitchen cap ${maxSrv(r)} — split cook sessions` : ""); };
        mn.onclick = (e) => { e.stopPropagation(); srv = Math.max(1, srv - 1); upd(); };
        pl.onclick = (e) => { e.stopPropagation(); srv = Math.min(40, srv + 1); upd(); };
        upd();
        const btns = box.createDiv({ cls: "addbtns" });
        const cancel = btns.createEl("button", { cls: "abtn", text: "cancel" });
        const add = btns.createEl("button", { cls: "abtn prim", text: "add" });
        cancel.onclick = (e) => { e.stopPropagation(); prompting = false; srv = r.base_servings; stage(); };
        add.onclick = (e) => { e.stopPropagation(); planEntry(r.id).servings = srv; renderAfterPlan(); };
      };
      stage();
    }
    function makeCard(r, featured) {
      const inPlan = plan.has(r.id);
      const pe = inPlan ? plan.get(r.id) : null;
      const ps = plateMacros(r, pe ? pe.qtys : null, pe ? pe.ver : null);
      const fit = targetFit(r, ps);
      const pDanger = !!(fit && fit.cls === "fit-warn" && /protein/.test(fit.text));
      const card = createDiv({ cls: "rcard" + (featured ? " feat" : "") });
      const body = card.createDiv({ cls: "rcbody" });
      const meta = body.createDiv({ cls: "rmeta2" });
      meta.createSpan({ cls: "rrole", text: mealLabel(r) });
      const cz = cuisineTags(r)[0];
      if (cz) { meta.createSpan({ cls: "dot", text: "·" }); meta.createSpan({ cls: "rcuis", text: cz }); }
      const titleBtn = body.createDiv({ cls: "rtitlebtn" });
      titleBtn.createDiv({ cls: "rname", text: r.name });
      if (r.subtitle) titleBtn.createDiv({ cls: "rsubt", text: r.subtitle });
      titleBtn.onclick = () => openModal(r.id);
      const mac = body.createDiv({ cls: "statrow" });
      stat(mac, "kcal", Math.round(ps.cal));
      stat(mac, "protein", g(ps.p), true, pDanger);
      stat(mac, "carbs", g(ps.c));
      stat(mac, "fat", g(ps.f));
      const cost = body.createDiv({ cls: "rcostline" });
      cost.createSpan({ cls: "rcost", text: `${money(ps.cost)} / serving` });
      if (r.prep_min) { cost.createSpan({ cls: "dot", text: "·" }); cost.createSpan({ cls: "rprep", text: `${r.prep_min} min` }); }
      if (r.versions && r.versions.length) {
        const brow = body.createDiv({ cls: "rbadgerow" });
        brow.createDiv({ cls: "rver", text: `+${r.versions.length} version${r.versions.length > 1 ? "s" : ""}` });
      }
      const cardTypes = typeTags(r);
      if (cardTypes.length) {
        const tg = body.createDiv({ cls: "rtags" });
        cardTypes.forEach(t => tg.createSpan({ cls: "rtag", text: t }));
      }
      const wrow = body.createDiv({ cls: "portrow" });
      wrow.createSpan({ cls: "pn", text: "per serving" });
      wrow.createSpan({ cls: "pv", text: plateGramsText(r, inPlan ? plan.get(r.id).qtys : null) });
      buildAddArea(card.createDiv({ cls: "addwrap" }), r);
      return card;
    }

    let carIndex = 0, carTimer = null;
    function renderCarousel() {
      if (carTimer) { clearInterval(carTimer); carTimer = null; }
      carEl.empty();
      const list = featuredList(filteredCache);
      if (!list.length) { carEl.createDiv({ cls: "carempty", text: "Nothing fits those filters." }); return; }
      if (carIndex >= list.length) carIndex = 0;
      const head = carEl.createDiv({ cls: "carhead" });
      head.createSpan({ cls: "carttl serif", text: "Featured" });
      const counter = head.createSpan({ cls: "carnum", text: `${carIndex + 1} / ${list.length}` });
      const vp = carEl.createDiv({ cls: "carvp" });
      const track = vp.createDiv({ cls: "cartrack" });
      list.forEach(r => track.createDiv({ cls: "carslide" }).appendChild(makeCard(r, true)));
      let dots = [];
      const apply = () => {
        track.style.transform = `translateX(-${carIndex * 100}%)`;
        counter.setText(`${carIndex + 1} / ${list.length}`);
        dots.forEach((d, i) => d.dataset.on = i === carIndex ? "1" : "0");
      };
      const go = (d) => { carIndex = (carIndex + d + list.length) % list.length; apply(); };
      if (list.length > 1) {
        const prev = carEl.createDiv({ cls: "carbtn prev", text: "‹" }); prev.onclick = () => go(-1);
        const next = carEl.createDiv({ cls: "carbtn next", text: "›" }); next.onclick = () => go(1);
        const dotsRow = carEl.createDiv({ cls: "cardots" });
        dots = list.map((_, i) => { const d = dotsRow.createDiv({ cls: "cardot" }); d.onclick = () => { carIndex = i; apply(); }; return d; });
      }
      apply();
      const start = () => { if (list.length > 1 && !carTimer) carTimer = setInterval(() => go(1), 6000); };
      const stop = () => { if (carTimer) { clearInterval(carTimer); carTimer = null; } };
      carEl.onmouseenter = stop; carEl.onmouseleave = start;
      let ds = null, drag = false;
      vp.onpointerdown = (e) => { ds = { x: e.clientX }; drag = false; };
      vp.onpointermove = (e) => { if (ds && Math.abs(e.clientX - ds.x) > 6) drag = true; };
      vp.onpointerup = (e) => { if (ds && drag) { const dx = e.clientX - ds.x; if (Math.abs(dx) > 40) go(dx > 0 ? -1 : 1); } ds = null; drag = false; };
      vp.onpointercancel = () => { ds = null; drag = false; };
      start();
    }

    function renderLibrary() {
      libEl.empty();
      const head = libEl.createDiv({ cls: "libhead" });
      head.createSpan({ cls: "libttl serif", text: "All recipes" });
      head.createSpan({ cls: "libnum", text: String(filteredCache.length) });
