    }

    function openModal(id, verId = null, srvOverride = null, qtyOverride = null) {
      const r = byId.get(id);
      const entry = plan.get(id);
      if (verId == null && entry && entry.ver) verId = entry.ver;
      modalId = id; modalVer = verId;
      const qtys = entry ? (entry.qtys || new Map()) : (qtyOverride || new Map());
      const servings = entry ? entry.servings : (srvOverride ?? r.base_servings);
      const scale = servings / r.base_servings;
      const ings = effectiveIngredients(r, qtys);
      const ver = versionOf(r, verId);
      const ps = plateMacros(r, qtys, verId);
      const mac = { ...ps };
      const fit = targetFit(r, mac);
      const pDanger = !!(fit && fit.cls === "fit-warn" && /protein/.test(fit.text));

      modal.empty();
      const mh = modal.createDiv({ cls: "mhdr" });
      const mhl = mh.createDiv();
      const kr = mhl.createDiv({ cls: "mkick" });
      kr.createSpan({ cls: "mrole", text: mealLabel(r) });
      const mcz = cuisineTags(r)[0];
      if (mcz) { kr.createSpan({ cls: "dot", text: "·" }); kr.createSpan({ cls: "mcuis", text: mcz }); }
      mhl.createDiv({ cls: "mname serif", text: r.name });
      if (r.subtitle) mhl.createDiv({ cls: "msubt", text: r.subtitle });
      const meta = mhl.createDiv({ cls: "mmeta" });
      meta.createSpan({ cls: "mcost", text: `${money(ps.cost)} / serving` });
      const prepMin = (ver && ver.prep_min) || r.prep_min;
      if (prepMin) { meta.createSpan({ cls: "dot", text: " · " }); meta.createSpan({ text: `~${prepMin} min` }); }
      const close = mh.createEl("button", { cls: "mclose", text: "close" });
      close.onclick = () => { modalId = null; backdrop.removeClass("on"); };

      if (r.versions && r.versions.length) {
        const vt = modal.createDiv({ cls: "vertoggle" });
        const mk = (vid, label) => {
          const c = vt.createDiv({ cls: "verchip", text: label });
          c.dataset.on = (verId || null) === (vid || null) ? "1" : "0";
          c.onclick = () => {
            if (plan.has(id)) { plan.get(id).ver = vid; renderAfterPlan(); }
            openModal(id, vid ?? undefined, srvOverride, qtyOverride);
          };
        };
        mk(null, "Base");
        r.versions.forEach(v => mk(v.id, v.name));
        if (ver && ver.swaps) {
          const sw = vt.createDiv({ cls: "verswap" });
          sw.setText((ver.swaps || []).map(s => `${s.from} → ${s.to}`).join(" · "));
          if (ver.target_flag && ver.target_flag !== "ok") sw.createSpan({ cls: "flag", text: `⚠ ${ver.target_flag}` });
        }
      }

      const mm = modal.createDiv({ cls: "statrow mstat" });
      stat(mm, "kcal", Math.round(mac.cal));
      stat(mm, "protein", g(mac.p), true, pDanger);
      stat(mm, "carbs", g(mac.c));
      stat(mm, "fat", g(mac.f));

      if (r.macro_target && r.macro_target.protein_g) {
        const t = r.macro_target; const ok = fit && fit.cls === "fit-ok";
        const tl = modal.createDiv({ cls: "mtarget" });
        const calPart = t.calories ? `${t.calories[0]}–${t.calories[1]} cal · ` : "";
        tl.setText(`target ${calPart}${t.protein_g[0]}–${t.protein_g[1]}g protein · `);
        tl.createSpan({ cls: ok ? "fit-ok" : "fit-warn", text: `this plate ${Math.round(mac.cal)} / ${Math.round(mac.p)}g ${ok ? "✓" : "⚠"}` });
      }

      const sv = modal.createDiv({ cls: "msrv" });
      const svL = sv.createDiv({ cls: "msrvl" });
      svL.createDiv({ cls: "msrvlab", text: "grams per serving" });
      svL.createDiv({ cls: "msrvval serif", text: plateGramsText(r, qtys) });
      const svR = sv.createDiv({ cls: "msrvr" });
      svR.createDiv({ cls: "msrvlab", text: "servings" });
      const st = svR.createDiv({ cls: "step" });
      const mn = st.createDiv({ cls: "stepbtn", text: "−" });
      st.createDiv({ cls: "stepval", text: String(servings) });
      const pl = st.createDiv({ cls: "stepbtn", text: "+" });
      const setSrv = (n) => {
        if (plan.has(id)) { plan.get(id).servings = n; openModal(id, verId); renderAfterPlan(); }
        else openModal(id, verId, n, qtyOverride);
      };
      mn.onclick = () => setSrv(Math.max(1, servings - 1));
      pl.onclick = () => setSrv(Math.min(40, servings + 1));
      if (servings > maxSrv(r)) svR.createDiv({ cls: "msrvlab fit-warn", text: `⚠ over kitchen cap ${maxSrv(r)} — split cook sessions` });

      modal.createDiv({ cls: "msection serif", text: "Ingredients" });
      const tbl = modal.createDiv({ cls: "ingtbl" });
      const th = tbl.createDiv({ cls: "ingh" });
      th.createSpan({ text: "item" });
      th.createSpan({ cls: "r", text: "metric" }); th.createSpan({ cls: "r", text: "imperial" });
      th.createSpan({ cls: "r", text: "unit" });
      th.createSpan({ cls: "r", text: "batch" }); th.createSpan({ cls: "r", text: "price" });
      ings.forEach((i, k) => {
        const orig = r.ingredients[k];
        const row = tbl.createDiv({ cls: "ingr" });
        const overridden = qtys.get(orig.name) !== undefined && qtys.get(orig.name) !== orig.qty;
        row.createSpan({ cls: overridden ? "ovr" : "", text: i.name });
        const perServingQty = i.qty / r.base_servings;
        const views = unitViews(i, perServingQty * i.unitSize);
        const box = (view) => {
          const cell = row.createDiv({ cls: "r qtycell" });
          if (!view) {
            cell.createSpan({ cls: "ingqty none", text: "—" });
            cell.createSpan({ cls: "qtyunit" });
            return;
          }
          const inp = cell.createEl("input", { cls: "ingqty" + (overridden ? " on" : "") });
          inp.type = "number"; inp.min = "0"; inp.max = String(QTY_MAX); inp.step = "any";
          inp.value = fmtAmt(view.amt);
          inp.title = `per serving — clear to reset to the recipe`;
          inp.dataset.qk = `${orig.name}|${view.abbr}`;
          cell.createSpan({ cls: "qtyunit", text: view.abbr });
          const reject = (why) => {
            inp.addClass("bad"); inp.title = why;
            const old = cell.querySelector(".qtyerr");
            if (old) old.setText(why); else cell.createSpan({ cls: "qtyerr", text: why });
          };
          inp.oninput = () => {
            inp.removeClass("bad"); inp.title = "per serving — clear to reset to the recipe";
            const old = cell.querySelector(".qtyerr"); if (old) old.remove();
          };
          inp.onchange = () => {
            const res = parseQtyInput(inp.value, QTY_MAX);
            if (res.error) return reject(res.error);
            const q = res.reset ? undefined : (res.qty * view.per / i.unitSize) * r.base_servings;
            if (plan.has(id)) {
              const e = planEntry(id);
              if (res.reset) e.qtys.delete(orig.name); else e.qtys.set(orig.name, q);
              openModal(id, verId); renderAfterPlan();
            } else {
              const m = qtyOverride || new Map();
              if (res.reset) m.delete(orig.name); else m.set(orig.name, q);
              openModal(id, verId, srvOverride, m);
            }
            const nb = modal.querySelector(`[data-qk="${CSS.escape(`${orig.name}|${view.abbr}`)}"]`);
            if (nb) nb.focus();
          };
        };
        box(views && views.metric);
        box(views && views.imperial);
        box(views && views.unit);
        const batch = views ? `${fmtAmt(views.metric.amt * servings)} ${views.metric.abbr}` : (i.unit || "to taste");
        row.createSpan({ cls: "r dim", text: batch });
        row.createSpan({ cls: "r succ", text: money(i.price * scale) });
      });
      const tot = tbl.createDiv({ cls: "ingtot" });
      tot.createSpan({ text: "total" });
      tot.createSpan({ cls: "succ", text: money(ings.reduce((a, i) => a + i.price, 0) * scale) });

      modal.createDiv({ cls: "msection serif", text: "Method" + (ver ? ` · ${ver.name}` : "") });
      const steps = (ver && ver.steps) ? ver.steps : (r.steps || []);
      const ol = modal.createDiv({ cls: "msteps" });
      steps.forEach((s, i) => { const li = ol.createDiv({ cls: "mstep" }); li.createSpan({ cls: "mnum", text: String(i + 1).padStart(2, "0") }); li.createSpan({ cls: "mtext", text: s }); });

      const foot = modal.createDiv({ cls: "mfoot" });
      const add = foot.createEl("button", { cls: "mfootbtn" + (plan.has(id) ? " on" : ""), text: plan.has(id) ? "✓ in plan — remove" : "add to plan" });
      add.onclick = () => {
        if (plan.has(id)) plan.delete(id);
        else {
          const e = planEntry(id);
          e.servings = servings; e.ver = verId || null;
          if (qtyOverride && qtyOverride.size) e.qtys = new Map(qtyOverride);
        }
        openModal(id, verId); renderAfterPlan();
      };
      backdrop.addClass("on");
    }

    function renderPlan() {
      savePlan();
      planPanel.empty();
      const ph = planPanel.createDiv({ cls: "phead" });
      ph.createSpan({ cls: "ptitle serif", text: "Prep Plan" });
      const phr = ph.createDiv({ cls: "prtop" });
      if (plan.size) {
        const clearChip = phr.createSpan({ cls: "vchip", text: "clear" });
        let armed = false;
        clearChip.onclick = () => {
          if (!armed) { armed = true; clearChip.setText("sure? tap again"); return; }
          plan.clear(); skipSet.clear(); vendorPick.clear();
          savePlan(); renderAfterPlan();
        };
      }
      phr.createSpan({ cls: "pcount", text: ` ${plan.size} pick${plan.size === 1 ? "" : "s"}` });
      const body = planPanel.createDiv({ cls: "pbody" });
      body.createDiv({ cls: "psub", text: `per-meal target ${MEAL_TARGET.cal} cal · ${MEAL_TARGET.p}g protein` });
      if (!plan.size) { body.createDiv({ cls: "empty", text: "Add a main, a side, and rice." }); return; }

      for (const [id, entry] of plan) {
        const r = byId.get(id);
        const ps = plateMacros(r, entry.qtys, entry.ver);
        const pver = versionOf(r, entry.ver);
        const row = body.createDiv({ cls: "planrow" });
        const top = row.createDiv({ cls: "prtop" });
        const nm = top.createDiv({ cls: "prname serif", text: pver ? `${r.name} · ${pver.name}` : r.name });
        nm.onclick = () => openModal(id);
        const x = top.createDiv({ cls: "prx", text: "×" });
        x.onclick = () => { plan.delete(id); renderAfterPlan(); };
        const mrow = row.createDiv({ cls: "prmeta" });
        const step = mrow.createSpan({ cls: "step" });
        const minus = step.createSpan({ cls: "stepbtn", text: "−" });
        step.createSpan({ cls: "stepval", text: `${entry.servings}` });
        const plus = step.createSpan({ cls: "stepbtn", text: "+" });
        minus.onclick = () => { entry.servings = Math.max(1, entry.servings - 1); renderAfterPlan(); if (modalId === id) openModal(id, modalVer); };
        plus.onclick = () => { entry.servings = Math.min(40, entry.servings + 1); renderAfterPlan(); if (modalId === id) openModal(id, modalVer); };
        mrow.createSpan({ text: ` srv · ${g(ps.p)} P · ${Math.round(ps.cal)} kcal` });
        if (entry.servings > maxSrv(r)) row.createDiv({ cls: "prmeta fit-warn", text: `⚠ over kitchen cap ${maxSrv(r)} — split cook sessions` });
        const tweaked = [...(entry.qtys || new Map())].filter(([nm2, q]) => {
          const line = r.ingredients.find(i => i.name === nm2);
          return line && q !== line.qty;
        });
        if (tweaked.length) {
          row.createDiv({ cls: "prqty", text: tweaked.map(([nm2, q]) => {
            const line = r.ingredients.find(i => i.name === nm2);
            if (line && line.unitSize && line.basis && line.basis !== "none") {
              const unit = line.basis === "volume" ? "ml" : "g";
              return `${nm2} ${fmtAmt(q * line.unitSize / r.base_servings)} ${unit}/srv`;
            }
            return `${nm2} ×${+q.toFixed(2)}`;
          }).join(" · ") });
        }
      }

      const planned = [...plan.keys()].map(id => byId.get(id));
      const hasMain = planned.some(r => r.role === "main");
      const hasSide = planned.some(r => r.role === "side");
      const hasBase = planned.some(r => r.role === "base");
      const comp = hasMain && hasSide && hasBase ? { t: "main + side + base ✓", ok: true }
        : !hasMain ? { t: "pick a main to start", ok: false }
        : !hasSide && !hasBase ? { t: "add a side + base", ok: false }
        : !hasBase ? { t: "missing base", ok: false } : { t: "missing side", ok: false };
      const cl = body.createDiv({ cls: "compline" });
      cl.createSpan({ cls: "complab", text: "composition" });
      cl.createSpan({ cls: comp.ok ? "compok" : "compwarn", text: comp.t });

      const side = planned.find(r => r.role === "side");
      const base = planned.find(r => r.role === "base");
      const mains = planned.filter(r => r.role === "main");
      mains.forEach(main => {
        const parts = [main, side, base].filter(Boolean);
        const t = parts.reduce((a, r) => { const e = plan.get(r.id); const ps = plateMacros(r, e.qtys, e.ver); return { cal: a.cal + ps.cal, p: a.p + ps.p }; }, { cal: 0, p: 0 });
        const label = parts.map(p => p.name).join(" + ");
        const line = body.createDiv({ cls: "mealline" });
        line.createEl("b", { text: label });
        const calOver = t.cal > MEAL_TARGET.cal;
        const pShort = t.p < MEAL_TARGET.p;
        const fitEl = line.createDiv({ cls: "mealfit" });
        fitEl.createSpan({ cls: calOver ? "fit-over" : "fit-ok", text: `${Math.round(t.cal)} / ${MEAL_TARGET.cal} cal` });
        fitEl.createSpan({ text: " · " });
        fitEl.createSpan({ cls: pShort ? "fit-over" : "fit-ok", text: `${Math.round(t.p)} / ${MEAL_TARGET.p}g protein` });
        fitEl.createSpan({ text: calOver ? " · over target" : pShort ? " · protein short" : " · fits" });
      });

      const mainSrv = mains.reduce((a, r) => a + plan.get(r.id).servings, 0);
      if (mainSrv) {
        const days = mainSrv / TARGETS.meals_per_day;
        const bl = body.createDiv({ cls: "batchline" });
        bl.createSpan({ cls: "bl", text: "days covered" });
        bl.createSpan({ text: `${mainSrv} srv ≈ ${(+days.toFixed(1))} days` });
      }
    }

    function shoppingItems() {
      const map = new Map();
      for (const [id, entry] of plan) {
        const r = byId.get(id);
        const scale = entry.servings / r.base_servings;
        for (const i of effectiveIngredients(r, entry.qtys)) {
          if (!(i.qty > 0)) continue;
          const key = `${i.name}|${i.unit}`;
          const cur = map.get(key) || {
            key, name: i.name, unit: i.unit, qty: 0, cat: i.cat, amount: null,
            yieldRatio: i.yieldRatio, buyBasis: i.buyBasis,
            defVendor: i.vendor, options: new Map(),
            amtLines: 0, noAmtLines: 0,
            home: INVENTORY[i.name] !== undefined
          };
          cur.qty += i.qty * scale;
          i.amount ? cur.amtLines++ : cur.noAmtLines++;
          if (i.amount) {
            const a = cur.amount || (cur.amount = {});
            if (i.amount.g != null) a.g = (a.g || 0) + i.amount.g * scale;
            if (i.amount.ml != null) a.ml = (a.ml || 0) + i.amount.ml * scale;
            if (i.amount.ct != null) { a.ct = (a.ct || 0) + i.amount.ct * scale; a.u = i.amount.u; }
          }
          const addOpt = (v, price, link, asin) => {
            const o = cur.options.get(v) || { price: 0, link: link || null, asin: asin || null };
            o.price += price * scale;
            if (link && !o.link) o.link = link;
            if (asin && !o.asin) o.asin = asin;
            cur.options.set(v, o);
          };
          addOpt(i.vendor, i.price, i.link, i.asin);
          (i.alts || []).forEach(a => addOpt(a.vendor, a.price, a.link, a.asin));
          map.set(key, cur);
        }
      }
      return [...map.values()].map(item => {
        if (item.yieldRatio && item.amount) {
          const a = item.amount;
          if (a.g != null) a.g /= item.yieldRatio;
          if (a.ml != null) a.ml /= item.yieldRatio;
          item.buyNote = `${item.buyBasis || "raw"} — recipe states cooked, ÷${item.yieldRatio}`;
        }
        const pick = vendorPick.get(item.key);
        item.vendor = (pick && item.options.has(pick)) ? pick : item.defVendor;
        const opt = item.options.get(item.vendor);
        item.price = opt.price;
        item.asin = opt.asin;
        item.skipped = skipSet.has(item.key);
        item.pack = packInfo(item);
        return item;
      });
    }
    function renderShop() {
      shopPanel.empty();
      const items = shoppingItems();
      const buy = items.filter(i => !i.home);
      const home = items.filter(i => i.home);
      const active = buy.filter(i => !i.skipped);
      const ph = shopPanel.createDiv({ cls: "phead" });
      ph.createSpan({ cls: "ptitle serif", text: "Shopping List" });
      ph.createSpan({ cls: "pcount succ", text: items.length ? money(active.reduce((a, i) => a + lineCost(i), 0)) : "" });
      if (!items.length) {
        shopPanel.createDiv({ cls: "pbody" }).createDiv({ cls: "empty", text: "Build a plan first." });
        return;
      }
      const rounded = active.filter(i => i.pack).length;
      shopPanel.createDiv({ cls: "pbody" }).createDiv({ cls: "psub", text: `${active.length} to buy · ${home.length} at home${buy.length - active.length ? ` · ${buy.length - active.length} skipped` : ""}${rounded ? ` · ${rounded} pack-rounded` : ""}` });

      const vendors = [...new Set(buy.map(i => i.vendor))].sort();
      vendors.forEach(v => {
        const vitems = buy.filter(i => i.vendor === v).sort((a, b) => a.name.localeCompare(b.name));
        const vh = shopPanel.createDiv({ cls: "vhead" });
        vh.createSpan({ text: v });
        vh.createSpan({ cls: "vn", text: String(vitems.length) });
        vitems.forEach(i => {
          const li = shopPanel.createDiv({ cls: `li${i.skipped ? " liskip" : ""}` });
          const nm = li.createSpan({ cls: "liname", text: i.name });
          const url = itemUrl(i);
          if (url && !i.skipped) nm.onclick = () => window.open(url, "_blank");
          const opts = [...i.options.keys()];
          if (opts.length > 1 && !i.skipped) {
            const cur = Math.max(0, opts.indexOf(i.vendor));
            const next = opts[(cur + 1) % opts.length];
            const chip = li.createSpan({ cls: "vchip", text: opts.length > 2 ? `⇄ ${next} · ${cur + 1}/${opts.length}` : `⇄ ${next}` });
            chip.onclick = () => { vendorPick.set(i.key, next); savePlan(); renderShop(); };
          }
          const qtyEl = li.createSpan({ cls: "liqty" });
          if (i.skipped) qtyEl.setText("skipped");
          else if (i.pack) {
            qtyEl.setText(`${i.pack.packs} × ${i.pack.label} · ${money(lineCost(i))} · ${i.pack.provenance === "confirmed" ? "✓" : "est"}`);
            qtyEl.title = `needs ${i.pack.needText}${i.pack.product ? ` · ${i.pack.product}` : ""} · pack data ${i.pack.provenance} (${i.pack.src})`;
          } else {
            qtyEl.setText(`${i.amount ? fmtAmount(i.amount, 1) : unitPhrase(i.qty, i.unit)} · ${money(i.price)}`);
          }
          const x = li.createSpan({ cls: "lix", text: i.skipped ? "↩" : "✕" });
          x.onclick = () => { i.skipped ? skipSet.delete(i.key) : skipSet.add(i.key); savePlan(); renderShop(); };
        });
      });
      if (home.length) {
        const vh = shopPanel.createDiv({ cls: "vhead" });
        vh.createSpan({ text: "At home — don't buy" });
        home.forEach(i => {
          const li = shopPanel.createDiv({ cls: "li lihome" });
          li.createSpan({ cls: "liname", text: i.name });
          const low = LOWSTOCK.has(i.name);
          li.createSpan({ cls: "note" + (low ? " low" : ""), text: (low ? "LOW · " : "") + INVENTORY[i.name] });
          const used = li.createSpan({ cls: "lix", text: "used up" });
          used.onclick = async () => {
            try {
              if (invDb && Array.isArray(invDb.stock) && ingDb && Array.isArray(ingDb.ingredients)) {
                const gid = new Map(ingDb.ingredients.map(g2 => [g2.name, g2.id])).get(i.name);
                const s = gid && invDb.stock.find(x => x.ingredient_id === gid);
                if (s) {
                  s.qty_on_hand = 0;
                  s.confidence = "estimate";
                  s.note = `used up ${todayISO()}`;
                  await writeInventory();
                }
              }
              delete INVENTORY[i.name];
              renderShop();
            } catch (e) { console.warn("[food] used-up failed", e); toast("Inventory save failed"); }
          };
        });
      }
      const tot = shopPanel.createDiv({ cls: "totline" });
      const packed = active.filter(i => i.pack && i.pack.cost != null).length;
      tot.createSpan({ text: packed ? `Est. total · ${packed}/${active.length} pack-priced` : "Est. total" });
      tot.createSpan({ cls: "succ", text: money(active.reduce((a, i) => a + lineCost(i), 0)) });

      const btns = shopPanel.createDiv({ cls: "btnrow" });
      const copyBtn = btns.createEl("button", { cls: "abtn", text: "Copy list" });
      const exportBtn = btns.createEl("button", { cls: "abtn commit", text: "Commit order" });
      const amazonItems = active.filter(i => i.vendor === "Amazon" && i.asin);
      if (amazonItems.length) {
        const azBtn = btns.createEl("button", { cls: "abtn", text: `Amazon cart (${amazonItems.length})` });
        azBtn.onclick = () => {
          const params = amazonItems.map((i, k) => `ASIN.${k + 1}=${encodeURIComponent(i.asin)}&Quantity.${k + 1}=${i.pack ? i.pack.packs : 1}`).join("&");
          window.open(`https://www.amazon.com/gp/aws/cart/add.html?${params}`, "_blank");
        };
      }
      const flash = (b, t) => { const old = b.textContent; b.addClass("flash"); b.setText(t); setTimeout(() => { b.removeClass("flash"); b.setText(old); }, 1400); };

      copyBtn.onclick = async () => {
        const lines = [];
        [...new Set(active.map(i => i.vendor))].sort().forEach(v => {
          lines.push(`## ${v}`);
          active.filter(i => i.vendor === v).forEach(i => lines.push(
            i.pack
              ? `- ${i.name} — ${i.pack.packs} × ${i.pack.label} (${money(lineCost(i))}) [needs ${i.pack.needText}]`
              : `- ${i.name} — ${i.amount ? fmtAmount(i.amount, 1) : unitPhrase(i.qty, i.unit)} (${money(i.price)})`));
        });
        if (home.length) { lines.push(`## At home`); home.forEach(i => lines.push(`- ${i.name} — ${INVENTORY[i.name]}`)); }
        try { await navigator.clipboard.writeText(lines.join("\n")); flash(copyBtn, "Copied ✓"); }
        catch (e) { console.warn("[food] clipboard failed", e); flash(copyBtn, "Failed"); }
      };
      exportBtn.onclick = async () => {
        if (exportBtn.disabled) return;
        exportBtn.disabled = true;
        const payload = {
          generated: new Date().toISOString(),
          source: "secundus-site (web)",
          plan: [...plan.entries()].map(([id, e]) => ({
            recipe: byId.get(id).name, servings: e.servings,
            version: (versionOf(byId.get(id), e.ver) || {}).name || null,
            qtys: [...(e.qtys || new Map())].map(([ing, q]) => ({ ingredient: ing, qty: q }))
          })),
          items: items.map(i => ({
            name: i.name, qty: +i.qty.toFixed(2), unit: i.unit,
            buy_amount: i.amount || null, buy_amount_text: i.amount ? fmtAmount(i.amount, 1) : unitPhrase(i.qty, i.unit),
            vendor: i.vendor,
            asin: i.asin || null, link: i.home ? null : itemUrl(i),
            vendor_options: [...i.options.keys()],
            buy_packs: i.pack ? i.pack.packs : null,
            pack_size: i.pack ? i.pack.label : null,
            pack_basis: i.pack ? i.pack.basis : null,
            pack_product: i.pack ? i.pack.product : null,
            pack_provenance: i.pack ? i.pack.provenance : null,
            pack_source: i.pack ? i.pack.src : null,
            est_price: +lineCost(i).toFixed(2),
            est_price_basis: (i.pack && i.pack.cost != null) ? "pack_price" : "unit_price",
            status: i.home ? "at_home" : (i.skipped ? "skipped" : "buy"),
            note: i.home ? INVENTORY[i.name] : ""
          })),
          est_total: +active.reduce((a, i) => a + lineCost(i), 0).toFixed(2)
        };
        try {
          await writeJSON(EXPORT_PATH, payload, `food: shopping list ${todayISO()} [site]`);
          const byVendor = {};
          active.forEach(i => { byVendor[i.vendor] = +((byVendor[i.vendor] || 0) + lineCost(i)).toFixed(2); });
          const invDelta = [];
          try {
            if (invDb && Array.isArray(invDb.stock) && ingDb && Array.isArray(ingDb.ingredients)) {
              const idByName = new Map(ingDb.ingredients.map(g2 => [g2.name, g2.id]));
              const stockById = new Map(invDb.stock.map(s => [s.ingredient_id, s]));
              const today = todayISO();
              active.forEach(i => {
                const gid = idByName.get(i.name);
                if (!gid) return;
                let add, unit;
                if (i.amount && i.amount.g != null) { add = i.amount.g; unit = "g"; }
                else if (i.amount && i.amount.ml != null) { add = i.amount.ml; unit = "ml"; }
                else if (i.amount && i.amount.ct != null) { add = i.amount.ct; unit = i.amount.u || i.unit || "unit"; }
                else { add = Number(i.qty) || 0; unit = i.unit || "unit"; }
                add = +add.toFixed(2);
                if (add <= 0) return;
                const ex = stockById.get(gid);
                if (ex && ex.unit === unit) {
                  ex.qty_on_hand = +(((Number(ex.qty_on_hand) || 0) + add).toFixed(2));
                  ex.confidence = "estimate";
                  ex.note = `+${add} ${unit} bought ${today}`;
                  invDelta.push({ ingredient_id: gid, add, unit, created: false });
                } else if (ex) {
                  ex.confidence = "estimate";
                  ex.note = `bought ${add} ${unit} ${today} (unit mismatch with "${ex.unit}" — not summed)`;
                } else {
                  const ni = { ingredient_id: gid, qty_on_hand: add, unit, confidence: "estimate", note: `bought ${today}` };
                  invDb.stock.push(ni);
                  stockById.set(gid, ni);
                  invDelta.push({ ingredient_id: gid, add, unit, created: true });
                }
              });
              await writeInventory();
            }
          } catch (e) { console.warn("[food] inventory bump failed (commit still ok)", e); }
          spendLog.push({
            ts: new Date().toISOString(), week_start: weekStartISO(new Date()),
            est_total: payload.est_total, by_vendor: byVendor, items: active.length,
            inv_delta: invDelta
          });
          await writeJSON(SPEND_PATH, spendLog, `food: grocery spend entry ${todayISO()} [site]`);
          flash(exportBtn, "Committed ✓");
          renderSpend();
        }
        catch (e) { console.warn("[food] commit failed", e); flash(exportBtn, "Failed"); toast("Commit failed — nothing written"); }
        finally { exportBtn.disabled = false; }
      };
    }

    function renderSpend() {
      spendPanel.empty();
      const ph = spendPanel.createDiv({ cls: "phead" });
      ph.createSpan({ cls: "ptitle serif", text: "Grocery Spend" });
      ph.createSpan({ cls: "pcount", text: spendLog.length ? `${spendLog.length} order${spendLog.length === 1 ? "" : "s"}` : "" });
      const body = spendPanel.createDiv({ cls: "pbody" });
      if (!spendLog.length) { body.createDiv({ cls: "empty", text: "No orders committed yet." }); return; }
      const budget = Number(TARGETS.grocery_week_usd) || null;
      const thisWeek = weekStartISO(new Date());
      const weeks = new Map();
      spendLog.forEach(e => {
        const w = weeks.get(e.week_start) || { total: 0, orders: 0 };
        w.total += e.est_total; w.orders += 1;
        weeks.set(e.week_start, w);
      });
      [...weeks.entries()].sort((a, b) => b[0].localeCompare(a[0])).slice(0, 4).forEach(([wk, w]) => {
        const li = body.createDiv({ cls: "li" });
        li.createSpan({ cls: "liname", text: `wk of ${wk.slice(5)}${wk === thisWeek ? " · now" : ""}` });
        const overBudget = budget != null && w.total > budget;
        const q = li.createSpan({ cls: "liqty", text: `${money(w.total)}${budget != null && wk === thisWeek ? ` / ${money(budget)}` : ""} · ${w.orders} order${w.orders === 1 ? "" : "s"}` });
        if (overBudget) q.style.color = "var(--warn)";
      });
      const last = spendLog[spendLog.length - 1];
      const btns = spendPanel.createDiv({ cls: "btnrow" });
      const undo = btns.createEl("button", { cls: "abtn", text: "Undo last commit" });
      if (!last.inv_delta) undo.title = "older order: removes the spend entry only, inventory untouched";
      let armed = false;
      undo.onclick = async () => {
        if (!armed) { armed = true; undo.setText(`Undo ${money(last.est_total)} — sure?`); return; }
        undo.disabled = true;
        try {
          (last.inv_delta || []).forEach(d => {
            const s = invDb.stock.find(x => x.ingredient_id === d.ingredient_id);
            if (!s) return;
            if (d.created) invDb.stock.splice(invDb.stock.indexOf(s), 1);
            else {
              s.qty_on_hand = Math.max(0, +((Number(s.qty_on_hand) || 0) - d.add).toFixed(2));
              s.confidence = "estimate";
              s.note = `undo commit ${todayISO()}`;
            }
          });
          if ((last.inv_delta || []).length) await writeInventory();
          spendLog.pop();
          await writeJSON(SPEND_PATH, spendLog, `food: undo last order [site]`);
          renderShop(); renderSpend();
        } catch (e) { console.warn("[food] undo failed", e); undo.setText("Failed"); undo.disabled = false; }
      };
    }

    buildFilters();
    renderContent();
    renderPlan();
    renderShop();
    renderSpend();
  }

  return { mount };
})();
</script>
</body>
</html>
