<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120a14">
<title>Secundus</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* ---------- app shell (Renovatio-dark, matches the Health apps) ---------- */
  :root {
    --bg:#120a14; --fg:#f0e8dc; --card:#1a111d; --card2:#231829;
    --hairline:#ffffff10; --dim:#a89f9a; --faint:#6b6068; --cue:#8b8078;
    --gold:#c9a86c; --gold-dim:rgba(201,168,108,.45); --gold-wash:rgba(201,168,108,.08);
    --done:#7a9b7a; --crimson:#9b3b4a;
    --serif:'Libre Baskerville',Georgia,serif;
    --body:'IBM Plex Sans',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --ok:#a6e3a1; --err:#f38ba8;
  }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--fg); font:15px/1.5 var(--body); display:flex; flex-direction:column; }
  header.app {
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    background:var(--card); position:sticky; top:0; z-index:10;
    border-bottom:1px solid var(--hairline);
  }
  header.app h1 { font-family:var(--serif); font-size:16px; font-weight:700; color:var(--gold); flex:1; }
  #sync-dot { width:9px; height:9px; border-radius:50%; background:var(--faint); }
  #sync-dot.ok { background:var(--ok); } #sync-dot.err { background:var(--err); }
  #sync-label { font-family:var(--mono); font-size:11px; color:var(--faint); }
  nav.app {
    display:flex; gap:0; padding:0 8px; overflow-x:auto; background:var(--card);
    border-bottom:1px solid var(--hairline); scrollbar-width:none;
  }
  nav.app::-webkit-scrollbar { display:none; }
  nav.app button {
    border:0; background:transparent; color:var(--faint); padding:11px 16px;
    font-family:var(--mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase;
    cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent;
  }
  nav.app button.active { color:var(--gold); border-bottom-color:var(--gold); background:var(--gold-wash); }
  main { flex:1; padding:14px; max-width:1100px; width:100%; margin:0 auto; }
  .view { display:none; } .view.active { display:block; }
  .card { background:var(--card); border:1px solid var(--hairline); border-radius:4px; padding:16px; margin-bottom:12px; }
  .placeholder { color:var(--faint); font-style:italic; }
  #gate { max-width:420px; margin:8vh auto; }
  #gate input, #gate select {
    width:100%; padding:10px; margin:6px 0 14px; border-radius:2px;
    border:1px solid var(--hairline); background:var(--card2); color:var(--fg); font-size:14px;
  }
  #gate button, .btn {
    background:none; color:var(--gold); border:1px solid var(--gold-dim);
    padding:10px 18px; border-radius:2px; font-family:var(--mono); font-size:12px;
    letter-spacing:.2em; text-transform:uppercase; cursor:pointer;
  }
  #gate button:hover, .btn:hover { background:var(--gold-wash); }
  .note-sm { font-size:12px; color:var(--faint); }
  #toast {
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--card2); color:var(--fg); padding:10px 18px; border:1px solid var(--hairline);
    border-radius:2px; font-family:var(--mono); font-size:12px; display:none; z-index:60;
    box-shadow:0 4px 16px #00000066; max-width:90vw;
  }
  @media (min-width:720px) { nav.app { justify-content:center; } main { padding:24px; } }

  /* ---------- Workout · Renovatio skin (ported from Workout.md) ---------- */
  .wkt{ color:var(--fg); background:var(--bg); font-family:var(--body);
    width:100%; max-width:none; font-size:15px; line-height:1.5; padding:4px 0 28px;
    --fs-xs:10px; --fs-sm:12px; --fs-md:15px; --fs-lg:16px; --fs-xl:22px; }
  .wkt .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .wkt .label{font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.3em;text-transform:uppercase;color:var(--gold-dim)}
  .wkt .hdr{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--hairline)}
  .wkt .kick{font-family:var(--mono);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--crimson);margin-bottom:6px}
  .wkt .brand{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1;color:var(--gold)}
  .wkt .hdate{font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
  .wkt .sub{font-family:var(--mono);font-size:11px;color:var(--faint);margin:10px 0 18px;line-height:1.6}
  .wkt .tabs{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--hairline);scrollbar-width:none}
  .wkt .tabs::-webkit-scrollbar{display:none}
  .wkt .tab{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;padding:12px 18px 10px;cursor:pointer;
    border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;text-align:left;user-select:none}
  .wkt .tab[data-on="1"]{border-bottom-color:var(--gold);background:var(--gold-wash)}
  .wkt .tabname{font-family:var(--serif);font-weight:600;font-size:var(--fs-md);color:var(--dim);letter-spacing:.05em}
  .wkt .tab[data-on="1"] .tabname{color:var(--gold)}
  .wkt .tabsub{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
  .wkt .gutter{display:flex;align-items:center;gap:16px;margin:18px 0 26px;flex-wrap:wrap}
  .wkt .gears{display:inline-flex;border:1px solid var(--hairline);border-radius:2px;overflow:hidden}
  .wkt .gear{padding:8px 18px;background:none;border:none;cursor:pointer;color:var(--faint);
    font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.25em;text-transform:uppercase}
  .wkt .gear + .gear{border-left:1px solid var(--hairline)}
  .wkt .gear[data-on="1"]{color:var(--gold);background:var(--gold-wash)}
  .wkt .dhead{margin-bottom:22px}
  .wkt .dtitle{font-family:var(--serif);font-weight:700;font-size:var(--fs-xl);line-height:1.2;margin:0}
  .wkt .dtag{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);margin-top:7px}
  .wkt .section{margin-bottom:26px}
  .wkt .shead{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
  .wkt .stitle{font-family:var(--serif);font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);white-space:nowrap}
  .wkt .srule{flex:1;height:1px;background:var(--hairline)}
  .wkt .smeta{font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
  .wkt .grid{display:grid;gap:14px}
  .wkt .mc{position:relative;display:grid;grid-template-columns:320px 1fr;border:1px solid var(--hairline);background:var(--card);overflow:hidden;border-radius:4px}
  .wkt .mc.done{border-color:var(--gold-dim)}
  .wkt .mcfig{position:relative;background:var(--card2);border-right:1px solid var(--hairline);min-height:170px}
  .wkt .mcfig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
  .wkt .mcph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);
    background-image:repeating-linear-gradient(45deg,transparent 0,transparent 9px,rgba(201,168,108,.04) 9px,rgba(201,168,108,.04) 10px)}
  .wkt .mcbody{position:relative;padding:18px 20px 16px;display:flex;flex-direction:column;gap:14px;min-width:0}
  .wkt .mckicker{display:flex;align-items:center;gap:10px}
  .wkt .mcrule{height:1px;width:26px;background:var(--gold);flex:0 0 auto}
  .wkt .mckick{font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
  .wkt .mcname{font-family:var(--serif);font-weight:600;font-size:var(--fs-xl);line-height:1.15;margin:6px 0 0}
  .wkt .mcmeta{display:flex;flex-wrap:wrap;gap:3px 16px;font-family:var(--mono);font-size:var(--fs-xs);
    letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-top:7px}
  .wkt .mcrx{color:var(--gold)}
  .wkt .mccues{margin:0;padding:0;list-style:none}
  .wkt .mccue{font-family:var(--mono);font-size:var(--fs-sm);color:var(--cue);display:grid;grid-template-columns:26px 1fr;gap:8px;padding:3px 0;line-height:1.55}
  .wkt .mccuen{color:var(--gold-dim)}
  .wkt .mccuet{font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:7px}
  .wkt .mcctrl{display:flex;gap:26px;align-items:flex-end;padding-top:13px;border-top:1px solid var(--hairline)}
  .wkt .fieldlab{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:4px}
  .wkt .field{min-width:82px}
  .wkt .inp{width:100%;background:transparent;border:none;border-bottom:1px solid var(--hairline);color:var(--fg);
    font-family:var(--mono);font-size:18px;padding:3px 0;font-variant-numeric:tabular-nums;outline:none}
  .wkt .inp:focus{border-bottom-color:var(--gold);color:var(--gold)}
  .wkt .hold{font-family:var(--mono);font-size:var(--fs-sm);letter-spacing:.15em;text-transform:uppercase;
    padding:9px 18px;background:none;color:var(--gold);border:1px solid var(--gold-dim);cursor:pointer;border-radius:2px}
  .wkt .hold.run{color:var(--fg);border-color:var(--gold);background:var(--gold-wash)}
  .wkt .hold.fin{color:var(--done);border-color:rgba(122,155,122,.5)}
  .wkt .mcfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:11px;
    border-top:1px solid var(--hairline);font-family:var(--mono);font-size:var(--fs-xs);color:var(--faint)}
  .wkt .dots{color:var(--gold-dim);letter-spacing:3px;cursor:pointer;user-select:none}
  .wkt .trend svg{display:block;margin-top:6px}
  .wkt .trendlab{font-family:var(--mono);font-size:var(--fs-xs);color:var(--faint)}
  .wkt .prose{border:1px solid var(--hairline);background:var(--card);padding:16px 20px;font-size:var(--fs-md);line-height:1.65;color:var(--dim);border-radius:4px}
  .wkt .note{border-left:2px solid var(--gold);background:var(--gold-wash);padding:13px 17px;font-size:var(--fs-md);line-height:1.6;color:var(--dim);margin-bottom:22px}
  .wkt .jm{border:1px solid var(--hairline);background:var(--card);padding:20px 22px;border-radius:4px}
  .wkt .jmitem{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:6px 0;font-size:var(--fs-md);color:var(--dim);line-height:1.55}
  .wkt .jmn{font-family:var(--mono);font-size:var(--fs-xs);color:var(--gold-dim);padding-top:4px}
  .wkt .yoga{display:flex;align-items:center;gap:14px;border-left:2px solid var(--gold);background:var(--gold-wash);padding:13px 17px;margin-bottom:22px}
  .wkt .tick{width:30px;height:30px;flex:0 0 auto;border:1px solid var(--gold-dim);background:none;color:var(--gold);
    display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer}
  .wkt .tick[data-on="1"]{background:var(--gold);color:var(--bg);border-color:var(--gold)}
  .wkt .yogatxt{font-family:var(--mono);font-size:var(--fs-sm);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  .wkt .stale{border-left:2px solid #b0563c;background:rgba(176,86,60,.10);padding:13px 17px;margin:14px 0 4px;
    font-family:var(--mono);font-size:var(--fs-sm);color:#d08a6e;letter-spacing:.05em;line-height:1.6}
  .wkt .sessionbar{margin-top:30px;padding-top:22px;border-top:1px solid var(--hairline)}
  .wkt .sessionbtn{width:100%;padding:17px;background:none;border:1px solid var(--gold-dim);color:var(--gold);cursor:pointer;
    font-family:var(--mono);font-size:var(--fs-sm);letter-spacing:.3em;text-transform:uppercase;border-radius:2px}
  .wkt .sessionbtn:hover{background:var(--gold-wash)}
  .wkt .sessionbtn[data-on="1"]{background:var(--gold);color:var(--bg);border-color:var(--gold)}
  .wkt .lightbox{display:none;position:fixed;inset:0;z-index:50;background:rgba(10,10,10,.94);
    align-items:center;justify-content:center;cursor:zoom-out;padding:24px}
  .wkt .lightbox.on{display:flex}
  .wkt .lightbox img{max-width:94vw;max-height:88vh;border:1px solid var(--hairline)}
  .wkt .lightbox .cap{position:fixed;bottom:26px;left:0;right:0;text-align:center;color:var(--dim);
    font-family:var(--mono);font-size:var(--fs-sm);letter-spacing:.2em;text-transform:uppercase}
  @media (max-width:640px){
    .wkt .mc{grid-template-columns:1fr}
    .wkt .mcfig{aspect-ratio:16/9;min-height:0;border-right:none;border-bottom:1px solid var(--hairline)}
    .wkt .mcname{font-size:var(--fs-lg)}
    .wkt .mcctrl{gap:16px}
  }

  /* ---------- Food · Renovatio skin (ported from Food.md) ---------- */
  .food{--bord:var(--hairline);--txt:var(--fg);--warn:#c45c4a;--purple:#8b5a9f;
   color:var(--txt);font-family:var(--body);font-size:15px;line-height:1.45;
   max-width:100%;width:100%;container-type:inline-size}
  .food *{box-sizing:border-box}
  .food button{font-family:inherit}
  .food .serif{font-family:var(--serif)}
  .food .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .food .hdr{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;
   border-bottom:1px solid var(--bord);padding-bottom:16px;margin-bottom:18px}
  .food .kick{font-family:var(--mono);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--crimson);margin-bottom:6px}
  .food .brand{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1;color:var(--gold)}
  .food .hr{display:flex;flex-wrap:wrap;gap:20px}
  .food .tpill{display:flex;align-items:baseline;gap:7px}
  .food .tpill .tl{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint)}
  .food .tpill .tv{font-family:var(--mono);font-size:14px;color:var(--gold)}
  .food .filters{display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--bord);padding-bottom:16px;margin-bottom:18px}
  .food .srow{display:flex;align-items:center;gap:10px}
  .food .searchwrap{position:relative;flex:1}
  .food .search{width:100%;font-family:var(--mono);font-size:13px;color:var(--txt);
   background:var(--card);border:1px solid var(--bord);border-radius:2px;padding:9px 12px;outline:none}
  .food .search::placeholder{color:var(--faint)}
  .food .search:focus{border-color:var(--gold-dim)}
  .food .resetchip{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);
   border:1px solid var(--bord);border-radius:2px;padding:9px 11px;cursor:pointer;white-space:nowrap}
  .food .resetchip:hover{border-color:var(--warn);color:var(--warn)}
  .food .chipwrap{display:flex;flex-direction:column;gap:10px}
  .food .chiprow,.food .numrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .food .chiprow .flabel,.food .numrow .flabel{width:62px;flex-shrink:0;white-space:nowrap}
  .food .flabel{font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--faint);margin-right:2px}
  .food .pill{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:1px;text-transform:uppercase;
   padding:6px 11px;border-radius:2px;cursor:pointer;color:var(--dim);border:1px solid var(--bord);background:transparent;user-select:none}
  .food .pill:hover{border-color:var(--gold-dim);color:var(--txt)}
  .food .pill[data-on="1"]{color:var(--gold);background:var(--gold-wash);border-color:var(--gold-dim)}
  .food .numf{display:flex;align-items:center;gap:6px;border:1px solid var(--bord);border-radius:2px;padding:5px 9px}
  .food .numf[data-on="1"]{border-color:var(--gold-dim);background:var(--gold-wash)}
  .food .numf .nfl{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--faint)}
  .food .numf .nfi{width:56px;background:transparent;border:none;outline:none;color:var(--txt);text-align:right;
   font-family:var(--mono);font-size:11px;-moz-appearance:textfield}
  .food .numf .nfi::-webkit-inner-spin-button,.food .numf .nfi::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .food .layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px;align-items:start}
  @container (max-width:820px){.food .layout{grid-template-columns:1fr}}
  .food .maincol{display:flex;flex-direction:column;gap:30px;min-width:0}
  .food .carousel{position:relative;padding:0 40px}
  .food .carhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .food .carttl{font-family:var(--serif);font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
  .food .carnum{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--faint)}
  .food .carvp{overflow:hidden;border:1px solid var(--bord);border-radius:4px;background:var(--card);touch-action:pan-y}
  .food .cartrack{display:flex;transition:transform .5s ease}
  .food .carslide{width:100%;flex:0 0 100%}
  .food .carbtn{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;display:flex;align-items:center;justify-content:center;
   border:1px solid var(--bord);border-radius:2px;background:var(--bg);color:var(--gold);cursor:pointer;font-size:18px;z-index:5}
  .food .carbtn:hover{border-color:var(--gold-dim);background:var(--card)}
  .food .carbtn.prev{left:0} .food .carbtn.next{right:0}
  .food .cardots{display:flex;justify-content:center;gap:7px;margin-top:14px}
  .food .cardot{height:5px;width:5px;border-radius:99px;background:var(--faint);cursor:pointer;transition:all .3s}
  .food .cardot[data-on="1"]{width:22px;background:var(--gold)}
  .food .carempty{border:1px solid var(--bord);border-radius:4px;background:var(--card);padding:40px;text-align:center;color:var(--dim);font-size:13px}
  .food .library .libhead{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--bord);padding-bottom:8px;margin-bottom:14px}
  .food .libttl{font-family:var(--serif);font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
  .food .libnum{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--faint)}
  .food .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .food .rcard{background:var(--card);border:1px solid var(--bord);border-radius:4px;display:flex;flex-direction:column;overflow:hidden}
  .food .rcard:hover{border-color:var(--gold-dim)}
  .food .rcard.feat{border-radius:0;border:none}
  .food .rcbody{padding:16px;display:flex;flex-direction:column;gap:9px}
  .food .rcard.feat .rcbody{padding:22px}
  .food .rmeta2{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim)}
  .food .rmeta2 .rrole{color:var(--gold)}
  .food .rmeta2 .rcuis{color:var(--faint)}
  .food .rmeta2 .dot{color:var(--faint)}
  .food .rcostline{display:flex;flex-wrap:wrap;align-items:baseline;gap:7px;font-family:var(--mono);font-size:11px;letter-spacing:.3px}
  .food .rcostline .rcost{color:var(--done);white-space:nowrap}
  .food .rcostline .rprep{color:var(--dim)}
  .food .rcostline .dot{color:var(--faint)}
  .food .rtitlebtn{display:block;width:100%;text-align:left;cursor:pointer;color:inherit}
  .food .rname{font-family:var(--serif);font-size:17px;font-weight:700;line-height:1.25;white-space:normal;overflow-wrap:anywhere}
  .food .rsubt{font-family:var(--mono);font-size:10.5px;letter-spacing:.5px;color:var(--dim);margin-top:3px}
  .food .msubt{font-family:var(--mono);font-size:12px;letter-spacing:.5px;color:var(--dim);margin-top:4px}
  .food .rcard.feat .rname{font-size:26px}

        <option value="rufo-mauricio-iii/secundus-site">secundus-site (build sandbox)</option>
